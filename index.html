  story:b=>storySheet(b.dataset.id,b.dataset.sun),
  fill:b=>fillSheet(b.dataset.sun,b.dataset.kind),
  fillPick:b=>{const{sun,kind,id}=b.dataset,l=lineup(sun);const st=kind==='stage'?id:l.stage?.c.id;const bo=kind==='booth'?[...l.booth.map(x=>x.c.id),id].slice(0,SLOTS.booth):l.booth.map(x=>x.c.id);setLineup(sun,st,bo);closeDlg();render()},
  takeOff:b=>{const{sun,id}=b.dataset,l=lineup(sun);setLineup(sun,l.stage?.c.id===id?'':l.stage?.c.id,l.booth.map(x=>x.c.id).filter(x=>x!==id));closeDlg();render()},
    close:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);saveCampaign({...c,status:'done'});toast('Campaign closed');go('timeline')},
  reopen:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);saveCampaign({...c,status:'active'});render()},
  askLevel:b=>{view.askLevel=+b.dataset.l;view.askCamp='';render()},
  askWhat:b=>{view.ask=b.dataset.k;render()},
    copyVerdict:()=>copy(replyFor(null,{level:view.askLevel||4,ask:view.ask||'stage'}),'Reply copied'),
  copyReply:()=>copy($('#replyText').value,'Reply copied'),
  copyAsk:()=>copy(location.origin+location.pathname+'?ask','Request link copied'),
  lateToggle:()=>{view.lateOpen=!view.lateOpen},
  skipLate:()=>{overdue().forEach(t=>{DB.ticks[t.key]={key:t.key,by:'Cleared',at:TODAY};post('tick',{key_:t.key,on:true,by:'Cleared'})});render()},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tick]');
  if(t){e.preventDefault();const k=t.dataset.tick;withName(()=>tick(k));return}
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  const l=e.target.closest('a[href^="#/"]');
  if(l){e.preventDefault();closeDlg();setRoute(l.getAttribute('href'));return}
  const b=e.target.closest('[data-act]');
  if(b&&ACT[b.dataset.act]){if(WRITES.has(b.dataset.act))withName(()=>ACT[b.dataset.act](b));else ACT[b.dataset.act](b)}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-story]');
  if(s){saveStory(s.dataset.story,s.value);toast('Story saved')}
});

// ---------- routes ----------
let route=location.hash||'#/todo';
function setRoute(h){
  if(h!==route)view.week=null;
  route=h;
  try{history.pushState(null,'',h)}catch(e){}
  render();
}
function go(p){setRoute('#/'+p)}
function render(){
  const app=$('#app');
  if(qs.has('ask')||route==='#/ask'){
    if(app.dataset.ask)return;
    app.dataset.ask='1';startQuiz('ask');return;
  }
  delete app.dataset.ask;
  if(!DEV&&!code){app.innerHTML=pageGate();bindGate();return}
  const y=scrollY;
  const[,name='todo',arg]=route.split('/');
  const html=name==='timeline'?pageTimeline():name==='c'?pageCampaign(decodeURIComponent(arg||'')):name==='sunday'?pageSunday(arg):name==='rules'?pageRules():pageTodo();
  const ss=$('.tl')?.scrollLeft;
  app.innerHTML=html;
  if($('.tl')){const t=$('.tl');t.scrollLeft=render.at===route&&ss!=null?ss:Math.max(0,$('.tl-now',t).offsetLeft-$('.tl-name',t).offsetWidth-TL_COL())}
  if(render.at===route)scrollTo(0,y);else scrollTo(0,0);
  render.at=route;
}
const syncRoute=()=>{const h=location.hash||'#/todo';if(h!==route){view.week=null;route=h;render()}};
addEventListener('hashchange',syncRoute);
addEventListener('popstate',syncRoute);

// ---------- gate ----------
function pageGate(){
  return `<div class="solo"><div class="logo">Promo</div><h1><em>Promo</em> Planner.</h1>
  <form id="gate"><label class="f">Office code<input name="code" type="password" required autocomplete="off"></label>
  <p class="err" id="gerr" hidden></p><div><button class="btn solid">Open</button></div></form></div>`;
}
function bindGate(){
  $('#gate').onsubmit=async e=>{e.preventDefault();const c=e.target.code.value.trim();
    try{const j=await fetchAll(c);if(!j.ok){const x=$('#gerr');x.hidden=false;x.textContent="That code didn't work.";return}
      ingest(j);code=c;try{localStorage.setItem('pp-code',c)}catch(x){}}
    catch(x){const y=$('#gerr');y.hidden=false;y.textContent="Couldn't reach the planner. Check your connection.";return}
    render()};
}

// ---------- boot ----------
(async function boot(){
  if(qs.has('ask')){render();return}
  if(DEV){
    let saved=null;try{saved=JSON.parse(localStorage.getItem('pp-demo'))}catch(e){}
    if(!saved||qs.has('reset')){if(!window.DEMO)await new Promise(r=>{const s=document.createElement('script');s.src='_local/demo.js';s.onload=r;s.onerror=r;document.head.append(s)});saved=window.DEMO||{}}
    ingest(saved);if(!me&&qs.has('me')){me=qs.get('me')}
    render();return;
  }
  try{const c=JSON.parse(localStorage.getItem('pp-data'));if(c)ingest(c)}catch(e){}
  render();
  await refresh(true);
  setInterval(()=>{if(!document.hidden)refresh()},45000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
