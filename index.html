<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promo Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap">
<style>
/* Direction, from the reference folder: off-white board, black pills, big light sentences with the
   important words in bold. Colour only ever means one thing: where a campaign is in the playbook
   (lilac awareness, orchid interest, yellow urgency, hatched rest). Red means overdue. */
:root{
  --paper:#F2F2ED;--white:#fff;--ink:#111;--ink2:#343434;--red:#D9281E;
  --yellow:#EEDC00;--orchid:#EFC4EE;--lilac:#D8CFF1;--greige:#E3E3DB;--aqua:#BDE7EF;--butter:#F8E19A;
  --band:#DDD9D0;--mute:#66665F;--line:rgba(17,17,17,.15);--faint:rgba(17,17,17,.06);--tilemute:rgba(17,17,17,.66);
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --gutter:clamp(16px,3vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
[hidden]{display:none!important}

/* ---------- frame ---------- */
.top{display:flex;align-items:center;gap:14px;padding:18px var(--gutter)}
.logo{font-size:22px;font-weight:700;letter-spacing:-.03em;text-decoration:none;margin-right:auto}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--faint)}
.nav a[aria-current=page]{background:var(--ink);color:var(--white)}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:var(--white);font-size:12.5px;font-weight:700}
.who{color:var(--mute);font-size:14px}
.fab{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;flex:none}
.fab:hover{background:var(--ink2)}
main{padding:clamp(10px,2.4vw,28px) var(--gutter) 72px;max-width:1480px;margin:0 auto}
h1{font:300 clamp(42px,6.2vw,88px)/1.02 var(--sans);letter-spacing:-.035em;text-wrap:balance}
h1 em{font-style:normal;font-weight:700}
h2{font:700 22px/1.15 var(--sans);letter-spacing:-.02em}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(20px,3vw,32px)}
.sect{margin-top:clamp(36px,5vw,60px)}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;font-weight:600;background:var(--white);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--band)}
.btn.solid{background:var(--ink);color:var(--white)}
.btn.solid:hover{background:var(--ink2)}
.btn.bare{background:none;padding:0 6px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.bare:hover{background:none;color:var(--mute)}
.flag{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 15px;border-radius:99px;background:var(--white);color:var(--red);font-weight:600;font-size:15px;text-decoration:none}

/* colour = playbook phase */
.ph-Awareness{background:var(--lilac)}
.ph-Interest{background:var(--orchid)}
.ph-Urgency{background:var(--yellow)}
.ph-prep{background:var(--greige)}
.ph-rest{background:repeating-linear-gradient(135deg,var(--greige) 0 2px,var(--white) 2px 9px)}
.ph-after{background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:22px;height:12px;border-radius:4px;display:block}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.l1{background:var(--ink);color:var(--white)}
.l2{background:#4A4A46;color:var(--white)}
.l3{background:#9A9A92;color:var(--ink)}
.l4{background:#D5D5CD;color:var(--ink)}
.l5{background:var(--greige);color:var(--ink)}

/* to-do item: the one control in the app that means "do this" */
.todo{display:flex;align-items:flex-start;gap:10px;width:100%;padding:6px 0;line-height:1.3;border-radius:8px}
.box{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.22);display:grid;place-items:center;flex:none;transition:box-shadow .12s,background .12s}
.todo:hover .box{box-shadow:inset 0 0 0 2px var(--ink)}
.todo.on .box{background:var(--ink);color:var(--white);box-shadow:none}
.todo-t{min-width:0;padding-top:1px}
.todo-t small{display:block;font-size:14px;color:var(--mute);line-height:1.3}
.todo.on .todo-t{color:var(--mute);text-decoration:line-through}
.todo.on .todo-t small{text-decoration:none}
.todo .opt{color:var(--mute)}

/* ---------- to do page ---------- */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px;font-size:18px}
.flag.solid{background:var(--red);color:var(--white)}
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(24px,3.4vw,48px);align-items:start;margin-top:clamp(22px,3vw,36px)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:clamp(22px,3vw,34px)}
.startcard{background:var(--ink);color:var(--white);border-radius:28px;padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px 28px}
.start-info{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.startcard h3{margin:0;font:600 clamp(26px,2.6vw,34px)/1.05 var(--sans);letter-spacing:-.03em}
.startcard .when{font-size:15px;opacity:.8}
.startcard .box{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.startcard .todo:hover .box{box-shadow:inset 0 0 0 2px var(--white)}
.startcard .todo.on .box{background:var(--white);color:var(--ink)}
.startcard .todo-t small,.startcard .todo.on .todo-t{color:rgba(255,255,255,.65)}
.startcard a.more{color:var(--white);font-weight:600;text-underline-offset:3px}
.todo-weeks{display:grid;gap:clamp(18px,2.4vw,26px)}
.wk-h{display:flex;align-items:baseline;gap:6px;width:100%;margin-bottom:10px}
.wk-h .mute{margin-left:auto;font-size:15.5px}
.day{padding-top:12px;border-top:1px solid var(--line)}
.day+.day{margin-top:18px}
.day-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:18px;font-weight:700;letter-spacing:-.012em;margin-bottom:8px}
.day-h .tg{font-size:13px;font-weight:600;background:var(--ink);color:var(--white);padding:2px 9px;border-radius:99px;letter-spacing:0}
.day-h .ev{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.group{background:var(--white);border-radius:20px;padding:12px 16px 8px}
.group-h{display:block;font-weight:700;line-height:1.2;margin-bottom:4px;text-decoration:none}
a.group-h:hover{text-decoration:underline}
.empty{padding:14px 0;color:var(--mute);font-size:18px}
.overdue{background:var(--white);border-radius:24px;padding:14px 18px;margin-bottom:22px;box-shadow:inset 0 0 0 1.5px var(--red)}
.overdue h2{color:var(--red);margin-bottom:8px}
.overdue .group{background:none;padding:6px 0 0}
.side-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.camp{display:block;background:var(--white);border-radius:22px;padding:14px 16px;text-decoration:none;margin-bottom:8px}
.camp:hover{background:var(--band)}
.camp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.camp-top b{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.camp-top span{font-size:14.5px;color:var(--mute);white-space:nowrap}
.pbar{display:flex;gap:2px;margin:9px 0 8px;height:12px;align-items:stretch}
.pbar i{flex:1;border-radius:3px;min-width:0}
.pbar i.past{opacity:.35}
.pbar i.now{box-shadow:0 0 0 2px var(--ink);z-index:1}
.camp-where{font-size:14.5px;color:var(--mute);line-height:1.3}
.camp-next{font-size:15.5px;font-weight:500;line-height:1.3;margin-top:2px}
.camp-next.late{color:var(--red)}
.compact{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-top:1px solid var(--line);text-decoration:none}
.compact:hover{text-decoration:underline}
.compact span{color:var(--mute);white-space:nowrap}
.asks{display:grid;gap:8px;margin-top:clamp(20px,3vw,30px)}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--white);border-radius:22px;padding:12px 14px 12px 20px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ask>div{flex:1;min-width:220px}
.ask b{font-size:18px;font-weight:700}

/* ---------- timeline ---------- */
.tl-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tl{overflow-x:auto;background:var(--white);border-radius:26px;padding-bottom:14px}
.tl-in{position:relative}
.tl-grid{background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--col))}
.tl-now{position:absolute;top:0;bottom:0;width:var(--col);background:rgba(17,17,17,.05);pointer-events:none}
.tl-head{display:flex;position:sticky;top:0}
.tl-name{position:sticky;left:0;z-index:3;flex:none;width:var(--name);background:var(--white);padding:6px 8px 6px 16px;box-shadow:1px 0 0 var(--line);display:block}
button.tl-name{cursor:pointer}
button.tl-name:hover b{text-decoration:underline}
.tl-name b{display:block;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.tl-name small{display:block;font-size:13px;color:var(--mute);line-height:1.25;margin-top:1px}
.tl-weeks{display:flex;height:52px}
.tl-wk{width:var(--col);flex:none;padding:8px 0 0 8px;font-size:14px;line-height:1.2}
.tl-wk b{display:block;font-weight:600;font-size:13px;height:16px}
.tl-wk.this{font-weight:700}
.tl-row{display:flex;align-items:stretch;border-top:1px solid var(--faint)}
.tl-track{position:relative;flex:none;min-height:54px}
.seg{position:absolute;top:8px;bottom:8px;display:flex;align-items:center;padding:0 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-decoration:none;border-radius:4px;color:var(--ink)}
.seg.first{border-radius:12px 4px 4px 12px}
.seg.last{border-radius:4px 12px 12px 4px}
.seg:hover{filter:brightness(.95)}
.tl-flag{position:absolute;top:50%;translate:0 -50%;background:var(--ink);color:var(--white);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;margin-left:5px}
.tl-detail{display:flex;border-top:1px dashed var(--line);background:var(--paper)}
.tl-cells{display:flex;flex:none}
.tl-cell{width:var(--col);flex:none;padding:8px 7px 10px;font-size:13px}
.tl-cell.this{background:rgba(17,17,17,.05)}
.tl-cell .todo{gap:6px;padding:4px 0;font-size:13px;line-height:1.2}
.tl-cell .box{width:15px;height:15px}
.tl-cell .box svg{width:10px;height:10px}
.tl-cell .todo-t small{display:none}
.chev{display:inline-block;transition:rotate .12s;color:var(--mute);margin-right:2px}
.chev.on{rotate:90deg}
.always{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:18px}
.always a{text-decoration:none}
.always a:hover{text-decoration:underline}
.always .on{font-weight:700}

/* ---------- one campaign ---------- */
.cz{border-radius:30px;padding:16px 18px 22px clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:clamp(22px,4vw,48px)}
.cz-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cz-top .spacer{flex:1}
.back{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;margin-left:calc(-1 * clamp(0px,1.2vw,10px))}
.cz h1{font:600 clamp(40px,6vw,84px)/.98 var(--sans);letter-spacing:-.045em}
.cz-date{margin-top:10px;font-size:clamp(19px,1.9vw,24px);font-weight:300;letter-spacing:-.015em}
.cz-now{margin-top:12px;font-size:17px;font-weight:500;line-height:1.3}
.cz-next{display:inline-flex;align-items:center;gap:12px;background:var(--white);border-radius:18px;padding:7px 18px 7px 14px;margin-top:12px;max-width:100%}
.cz-next>span{font-size:14.5px;color:var(--mute)}
.strip{display:flex;gap:3px;margin:12px 0 24px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:1 0 74px;border-radius:10px;padding:8px 9px;text-decoration:none;font-size:12.5px;line-height:1.2;font-weight:600;min-height:56px}
.strip a small{display:block;font-weight:400;font-size:12.5px}
.strip a.now{box-shadow:inset 0 0 0 2px var(--ink)}
.pw{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(14px,2.4vw,30px);padding:18px 0;border-top:1px solid var(--line);scroll-margin-top:12px}
.pw.now{background:var(--white);border-radius:24px;border:0;padding:18px 20px;margin:6px -4px}
.pw-date{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pw-tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;margin:6px 6px 0 0;color:var(--ink)}
.pw-tag.tw{background:var(--ink);color:var(--white)}
.pw-angle{font-size:17px;font-weight:600;margin-top:8px;line-height:1.2}
.pw-why{font-size:14.5px;color:var(--mute);line-height:1.32;margin-top:3px}
.pw-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,24px);align-content:start}
.pw-col h4{margin:0 0 4px;font-size:14.5px;font-weight:400;color:var(--mute)}
.pw-col .note{font-size:14.5px;color:var(--mute)}
.pw-done{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);color:var(--mute)}
.linkish{font-size:14.5px;text-decoration:underline;text-underline-offset:3px;padding:0 0 4px 32px;display:block;color:var(--ink)}
.storyline{font-size:14.5px;padding:0 0 6px 32px;color:var(--ink);display:block;width:100%}
label.f{display:grid;gap:6px;font-weight:600}
input[type=text],input[type=date],input[type=email],input[type=password],input:not([type]),select,textarea{width:100%;min-height:50px;padding:12px 16px;border:0;border-radius:16px;background:var(--white);font-weight:400;font-size:16px}
textarea{line-height:1.4;resize:vertical;min-height:110px}

/* ---------- sunday ---------- */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.rail a{padding:8px 14px;border-radius:99px;background:var(--white);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
.rail a:hover{background:var(--band)}
.rail a[aria-current=true]{background:var(--ink);color:var(--white)}
.rail small{font-size:13px;opacity:.65;margin-left:5px}
.slots{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.slot{display:flex;flex-direction:column;justify-content:space-between;gap:22px;min-height:300px;padding:18px 20px;border-radius:28px;width:100%}
.slot-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 13px;border-radius:99px;background:var(--white);font-weight:600;font-size:14.5px}
.slot-open{align-items:center;justify-content:center;gap:10px;color:var(--mute);text-align:center;font-weight:500;box-shadow:inset 0 0 0 1.5px var(--line)}
.slot-open:hover{background:var(--faint)}
.slot-open.locked{cursor:default}
.slot-open.locked:hover{background:none}
.slot-open .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--white);color:var(--ink)}
.slot-name{display:block;font:600 clamp(27px,2.6vw,36px)/1.04 var(--sans);letter-spacing:-.032em;text-wrap:balance;width:100%}
.stage .slot-name{font-size:clamp(36px,4.4vw,60px);line-height:1;letter-spacing:-.04em}
.slot-foot{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.slot-foot b{font-weight:700}
.slot-foot .sub{color:rgba(17,17,17,.66);font-size:14.5px}
.slot-foot .story{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.slot-foot p{margin:0;line-height:1.32;cursor:pointer}
.quiet{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 32px;margin-top:20px}
.quiet dt{color:var(--mute);font-size:14.5px}
.quiet dd{font-size:17px;line-height:1.35}
.quiet dd a{text-decoration:none}
.quiet dd a:hover{text-decoration:underline}

/* ---------- rules ---------- */
.matrix-wrap{overflow-x:auto;background:var(--white);border-radius:24px;padding:6px 8px}
.matrix{border-collapse:collapse;width:100%;min-width:720px;font-size:15px;line-height:1.3}
.matrix th,.matrix td{padding:11px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--faint)}
.matrix thead th{border:0;font-weight:700;font-size:16px}
.matrix thead small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.matrix tbody th{font-weight:400;color:var(--mute);width:110px}
.matrix .sel{background:rgba(238,220,0,.28)}
.steps-ask{display:grid;gap:18px;max-width:900px}
.step-n{display:flex;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.012em;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{min-height:42px;padding:0 16px;border-radius:99px;background:var(--white);font-weight:500}
.choice:hover{background:var(--band)}
.choice[aria-pressed=true]{background:var(--ink);color:var(--white)}
.lbl{font-weight:600;display:block}
.verdict{border-radius:28px;padding:clamp(20px,2.6vw,30px);display:grid;gap:12px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.verdict .big{font:700 clamp(30px,3.4vw,42px)/1.05 var(--sans);letter-spacing:-.03em}
.verdict .instead{font-size:18px;line-height:1.38;max-width:60ch}
.verdict .because{color:var(--mute)}
.ladder{display:grid;gap:7px}
.rung{display:flex;align-items:center;gap:14px;width:100%;border-radius:18px;padding:0 18px;font-weight:600;letter-spacing:-.015em;min-height:52px;font-size:17px}
.rung small{margin-left:auto;font-weight:400;font-size:14.5px;letter-spacing:0;text-align:right}
.rung[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.rung:hover{filter:brightness(.95)}
.gets{display:grid;gap:15px}
.gets dt{color:var(--mute);font-size:14.5px}
.gets dd{font-size:18px;font-weight:500;line-height:1.3}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px}
.rules b{display:block;font:600 19px/1.15 var(--sans);letter-spacing:-.018em}
.rules span{display:block;margin-top:3px;color:var(--mute);max-width:44ch}

/* ---------- sheets ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:32px;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto}
dialog::backdrop{background:rgba(17,17,17,.4)}
dialog[open]{animation:rise .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.sheet{display:grid;gap:18px;padding:clamp(20px,3vw,30px)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sheet h2{font:600 clamp(28px,3.4vw,38px)/1.08 var(--sans);letter-spacing:-.035em}
.sheet-sub{margin-top:5px;font-size:17px;color:var(--mute)}
.x{width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center;flex:none}
.x:hover{background:var(--band)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.sheet-foot .left{margin-right:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.echo{font-weight:500;margin-top:-6px}
.echo:empty{display:none}
.earlier{display:grid;gap:9px;font-size:15px}
.earlier li span{display:block;color:var(--mute);font-size:14px}
.opts{display:grid;gap:7px}
.opt-row{display:flex;align-items:center;gap:12px;background:var(--white);padding:13px 18px;border-radius:18px;width:100%;font-weight:600}
.opt-row:hover{background:var(--band)}
.opt-row span{margin-left:auto;font-weight:400;color:var(--mute);font-size:14.5px;text-align:right}
.reply{min-height:320px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--ink);color:var(--white);padding:12px 20px;border-radius:99px;font-weight:500;z-index:50;white-space:nowrap}

/* ---------- questionnaire ---------- */
.quiz{display:grid;gap:18px;padding:clamp(18px,3vw,28px)}
.solo .quiz{padding:0}
.q-top{display:flex;align-items:center;gap:10px}
.q-top .segs{flex:1;color:var(--ink);height:5px}
.q-top .segs i{height:4px}
.q-top .segs i.past{height:4px}
.q-text{font:300 clamp(29px,4vw,40px)/1.08 var(--sans);letter-spacing:-.03em;text-wrap:balance}
.q-text em{font-style:normal;font-weight:700}
.q-opts{display:grid;gap:8px}
.q-opt{display:block;width:100%;background:var(--white);border-radius:22px;padding:16px 20px}
.q-opt:hover{background:var(--ink);color:var(--white)}
.q-opt:hover span{color:var(--white)}
.q-opt b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.q-opt span{display:block;margin-top:2px;font-size:14.5px;color:var(--mute)}
.q-result{border-radius:28px;padding:20px 22px}
.q-result small{display:block;font-size:15px}
.q-result b{display:block;font:600 clamp(36px,5vw,52px)/1 var(--sans);letter-spacing:-.04em;margin-top:3px}
.q-result p{margin-top:10px;font-size:16px;line-height:1.35}
.plan-list{display:grid;gap:0;background:var(--white);border-radius:22px;padding:6px 18px}
.plan-list li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0}
.plan-list li+li{box-shadow:0 -1px 0 var(--faint)}
.plan-list time{font-weight:600}
.plan-list b{font-weight:600}
.plan-list span{display:block;font-size:14.5px;color:var(--mute);line-height:1.3}
.nots{display:grid;gap:3px;font-size:15px;color:var(--mute)}

/* ---------- walkthrough ---------- */
dialog.tourd{width:min(680px,calc(100vw - 32px))}
.tour{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding:clamp(16px,2.6vw,24px);min-height:min(600px,calc(100dvh - 64px))}
.tour-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tour-dots{display:flex;gap:5px;flex:1;max-width:240px}
.tour-dots i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.tour-dots i.on{background:var(--ink)}
.tour h2{font:300 clamp(34px,5vw,50px)/1.04 var(--sans);letter-spacing:-.035em;text-wrap:balance}
.tour h2 em{font-style:normal;font-weight:700}
.tour-body{display:grid;align-content:start;gap:16px}
.tour-body>p{font-size:18px;line-height:1.38;max-width:50ch}
.tour-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini-hero{border-radius:26px;background:var(--yellow);padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.mini-hero b{font:600 clamp(30px,5vw,44px)/1 var(--sans);letter-spacing:-.04em}
.mini-ladder{display:grid;gap:5px}
.mini-ladder div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:15px;padding:0 15px;font-weight:600}
.mini-ladder small{font-weight:400;font-size:14px;text-align:right}
.mini-ladder .m1{min-height:64px;font-size:21px}
.mini-ladder .m2,.mini-ladder .m3{min-height:50px;font-size:17px}
.mini-ladder .m4{min-height:42px}
.mini-ladder .m5{min-height:36px;font-size:14.5px}
.mini-slots{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.mini-slots div{border-radius:20px;padding:13px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;line-height:1.1}
.mini-slots small{font-weight:500;font-size:13.5px}
.mini-slots b{font-size:clamp(16px,2.6vw,23px);font-weight:600;letter-spacing:-.02em}
.mini-slots .open{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute)}
.mini-tl{background:var(--white);border-radius:20px;padding:14px;display:grid;gap:8px}
.mini-tl div{display:flex;gap:2px;height:30px}
.mini-tl i{flex:1;border-radius:4px;font-style:normal;font-size:12px;font-weight:600;padding:7px 5px;overflow:hidden;white-space:nowrap}
.mini-week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-week div{background:var(--white);border-radius:20px;padding:13px}
.mini-week b{display:block;font-weight:700;margin-bottom:3px}
.mini-week span{display:block;font-size:14.5px;color:var(--mute);line-height:1.28}
.tour .group{max-width:340px}
.seq{display:grid;gap:0;background:var(--white);border-radius:22px;padding:6px 18px;counter-reset:s}
.seq li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);padding:9px 0;align-items:baseline}
.seq li::before{content:counter(s);font-weight:700}
.seq li+li{box-shadow:0 -1px 0 var(--faint)}
.seq span{color:var(--mute);display:block;font-size:14.5px;line-height:1.3}
.helpbtn{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-weight:600;font-size:18px;flex:none}
.helpbtn:hover{background:var(--faint)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 40px}
.gloss dt{font-weight:700}
.gloss dd{color:var(--mute);line-height:1.35}

/* ---------- gate + request ---------- */
.solo{min-height:100dvh;display:grid;align-content:center;gap:28px;width:min(560px,100%);margin:0 auto;padding:32px 20px}
.solo form{display:grid;gap:14px}
.err{font-weight:600;background:var(--white);color:var(--red);padding:10px 16px;border-radius:14px}
.hp{position:absolute;left:-9999px}

@media (max-width:1040px){
  .slots{grid-template-columns:1fr 1fr}
  .slot.stage{grid-column:1/-1;min-height:260px}
  .slot{min-height:230px}
  .home{grid-template-columns:minmax(0,1fr)}
  .home aside{order:-1;min-width:0}
  .home .upnext{display:none}
  .runlist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gutter));padding-inline:var(--gutter)}
  .runlist::-webkit-scrollbar{display:none}
  .runlist .camp{flex:0 0 min(300px,82%);margin:0}
  .pw{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .top{padding-block:14px}
  .who{display:none}
  .nav{position:fixed;z-index:20;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--ink);padding:6px;border-radius:99px;margin:0;justify-content:space-between;gap:0}
  .nav a{position:relative;flex:1 1 auto;justify-content:center;color:var(--white);padding:12px 8px;font-size:15px;gap:0;min-width:0}
  .nav a:hover{background:none}
  .nav a[aria-current=page]{background:var(--white);color:var(--ink)}
  .nav .count{position:absolute;top:8px;right:4px;min-width:9px;width:9px;height:9px;padding:0;font-size:0;box-shadow:0 0 0 2px var(--ink)}
  .head{align-items:stretch}
  .slots{grid-template-columns:1fr}
  .slot,.slot.stage{min-height:0;gap:30px}
  .slot-open.slot{flex-direction:row;min-height:78px;padding:14px;border-radius:24px}
  .pw-cols{grid-template-columns:minmax(0,1fr)}
  .pw.now{margin-inline:-6px;padding:16px}
  .cz{border-radius:26px}
  .rung small{display:none}
  .two{grid-template-columns:1fr}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:30px 30px 0 0;max-height:92dvh}
  dialog[open]{animation-name:riseup}
  .sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  dialog.tourd{width:100vw}
  .tour{padding-bottom:calc(18px + env(safe-area-inset-bottom));min-height:min(560px,88dvh)}
  @keyframes riseup{from{transform:translateY(40px)}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<script>
// ---------- config ----------
const CONFIG={
  apiUrl:'', // Apps Script web app URL (see apps-script/Code.gs)
  nextStep:'Head to oceansidechurch.ca and click the Next Steps button.',
};
const SLOTS={stage:1,booth:2};
const qs=new URLSearchParams(location.search);
const DEV=!CONFIG.apiUrl&&(!!window.DEMO||/^(localhost|127\.0\.0\.1)$/.test(location.hostname));

// ---------- dates ----------
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const S=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const x=D(s);x.setDate(x.getDate()+n);return S(x)};
const sunOf=s=>add(s,-D(s).getDay());
const fmt=(s,o)=>D(s).toLocaleDateString('en-CA',o||{month:'short',day:'numeric'});
const long=s=>fmt(s,{month:'long',day:'numeric'});
const full=s=>fmt(s,{weekday:'long',month:'long',day:'numeric'});
const TODAY=(DEV&&qs.get('today'))||S(new Date());
const nextSun=s=>D(s).getDay()===0?s:add(sunOf(s),7);
const DAYN={0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'};
const WORD=['nothing','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const word=n=>WORD[n]??String(n);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

// ---------- icons ----------
const I=(p,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  say:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  slide:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',
  desk:'<path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 12V9M10 6h4"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 8 9 6 9-6"/>',
  text:'<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/>',
  social:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
  fb:'<path d="M14 21v-8h3l.5-3.5H14V7.5c0-1 .5-2 2-2h1.5V3S16 3 15 3c-3 0-4.5 2-4.5 4.5v2H8V13h2.5v8"/>',
  bulletin:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/>',
  post:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="m9 5 7 7-7 7"/>',
  go:'<path d="M7 17 17 7M8.5 7H17v8.5"/>',
};
const CH={say:'Announcement',slide:'Pre-service slide',desk:'Welcome Desk',web:'Website',email:'Email',text:'Text',social:'Social',fb:'Facebook event',bulletin:'Weekly Bulletin',post:'After',prep:'Get ready'};

// ---------- playbooks ----------
// One week: phase, the announcement angle, say (req/opt/none), on the slide, at the desk, bulletin spot, tasks [weekday, channel, label, optional].
const W=(phase,angle,say,slide,desk,bull,tasks=[])=>({phase,angle,say,slide,desk,bull,tasks});
const TUE=(email,text,social,opt={})=>[[2,'email',email,opt.email],[2,'text',text,opt.text],[2,'social',social,opt.social]];
const PB={};
PB[1]={1:W('Awareness','Launch','req',1,1,'Featured',[[0,'web','Publish the Launcher action'],[0,'web','Publish the web page and Info Card'],...TUE('Send the launch email','Send the launch text','Post a Story and feed sprinkle'),[2,'fb','Create the Facebook event']]),
  2:W('Awareness','Rest',null,1,1,'Upcoming'),
  3:W('Awareness','The Handoff','req',1,1,'Highlight',TUE('Send a sprinkle email','Send a sprinkle text','Post a poll or something light',{email:1,text:1})),
  4:W('Awareness','The Callback','req',1,1,'Highlight',TUE('Send a sprinkle email','Send a sprinkle text','Post a sprinkle',{email:1,text:1})),
  5:W('Interest','Move to interest','req',1,1,'Highlight'),
  6:W('Interest','Values and voice','req',1,1,'Highlight',TUE('Email: repurpose Sunday','Text: repurpose Sunday','Social: repurpose Sunday')),
  7:W('Interest','Fresh creative','req',1,1,'Highlight',TUE('Email: repurpose Sunday','Text: repurpose Sunday','Social: repurpose Sunday')),
  8:W('Urgency','Sprint','req',1,1,'Featured',[[0,'web','Upgrade the Launcher action to Featured'],[0,'web','Publish the floating banner'],[0,'social','Run the sprint: daily social, email or text, 7 days at most']])};
const MID=l=>{const who=l==2?'churchwide':'ministry';return {
  1:W('Interest','Launch','req',1,1,'Highlight',[[0,'web','Publish the Launcher action'],[0,'web','Publish the page or Next Steps section'],...TUE(`Send the ${who} sprinkle email`,`Send the ${who} sprinkle text`,'Social: repurpose Sunday'),[2,'fb','Create the Facebook event',1]]),
  2:W(l==3?'Awareness':'Interest','Rest',null,1,1,'Highlight'),
  3:W('Interest','Values and voice','opt',1,1,'Highlight',TUE(`Send the ${who} sprinkle email`,`Send the ${who} sprinkle text`,'Social: repurpose Sunday',{email:l==2,text:l==2})),
  4:W('Urgency','Urgency','req',1,1,'Highlight',TUE(`Send the ${who} sprinkle email`,`Send the ${who} sprinkle text`,'Social: repurpose Sunday'))}};
PB[2]=MID(2);PB[3]=MID(3);
PB[4]=PB[5]={1:W('Interest','Launch',null,0,1,'Featured',[[0,'web','Publish the post in the ministry collection'],[0,'web','Add the event to the Calendar page'],[0,'web','Add a Next Steps section',1],...TUE('Send the ministry email','Send the ministry text','Post a sprinkle',{social:1}),[2,'fb','Create the Facebook event',1]]),
  2:W('Interest','Hold',null,0,1,'Featured'),
  3:W('Interest','New creative',null,0,1,'Featured',TUE('Send the ministry email, new creative','Send the ministry text','Post a sprinkle',{social:1})),
  4:W('Urgency','This weekend','smuggle',0,1,'Featured: this weekend',TUE('Send the ministry email: final chance','Send the ministry text','Post a sprinkle',{social:1}))};
// Why each week looks the way it does, from the playbooks.
const WHYWEEK={
  1:{1:'Begin promotion churchwide with one story and one next step.',2:'Stay visible without oversaturating. No churchwide reminders.',3:'Re-surface it with something interactive. Connect in-person and online.',4:'Recap last week and carry the momentum.',5:'Shift to interest. Social, email and text rest for a week.',6:'Anchor it in a value and repurpose it across channels.',7:'Keep momentum with creative variety.',8:'Final push: high-visibility web, plus a sprint.'},
  2:{1:'Begin promotion churchwide with one story and one next step.',2:'Stay visible without oversaturating.',3:'Anchor it in a value and repurpose it across channels.',4:'Final push. Urgency is in the words, not more promos.'},
  4:{1:'Publish the web listings, announce it in the bulletin, send to the ministry list.',2:'Stay visible. Avoid repeating reminders.',3:'Repeat week 1 with new creative.',4:'Use urgency language: this weekend, final chance.'}};
WHYWEEK[3]=WHYWEEK[2];WHYWEEK[5]=WHYWEEK[4];
const PREP=l=>l<=3?['Find the story','Make the graphics','Build the web page']:['Find a story or photo','Write the post'];
const WEEKMAP={8:[1,2,3,4,5,6,7,8],4:[1,2,3,4],3:[1,3,4],2:[1,4]};
const AFTER=l=>[[0,'post','Post live updates and behind-the-scenes'],[1,'post','Publish the recap post and email'],[1,'web',l==1?'Remove the banner, Launcher action and Info Card':'Remove the Launcher action and Next Steps section']];
const HIGHLIGHT=[[2,'social','Post a spotlight sprinkle'],[2,'email','Send a churchwide sprinkle email',1],[2,'text','Send a churchwide sprinkle text',1]];

const LEVEL={
  1:{name:'Impacts 80% of the church',eg:'Christmas, Easter, Kick-Off Sunday, Church Outside, Love Your City, a service time or location change',
    web:'Banner, Launcher, page, Info Card, Weekly Bulletin',msg:'Churchwide',social:'Sprint and sprinkle promos',sun:'Announcement, pre-service slide, Welcome Desk',len:'8 weeks'},
  2:{name:'Core next steps',eg:'Connect card, serving, giving, baptism, small groups, Newcomers Group',
    web:'Launcher, page, Info Card, Weekly Bulletin',msg:'Churchwide',social:'Sprinkle promos',sun:'Announcement, pre-service slide, Welcome Desk',len:'2 to 4 weeks'},
  3:{name:'Next generation',eg:'ONE80 Kids, Ocean Youth, young adults',
    web:'Launcher, page, Info Card, posts, Weekly Bulletin',msg:'Ministry list',social:'Sprinkle promos',sun:'Announcement, pre-service slide, Welcome Desk',len:'2 to 4 weeks'},
  4:{name:'Individual ministries',eg:"Rooted, Men's Group, Congo Orphanage, Crossroad Pregnancy Center, Soul Nights Group, Foster Care",
    web:'Info Card, Next Steps page, posts, Weekly Bulletin',msg:'Ministry list',social:'Sprinkle promos',sun:'Bulletin slide, Welcome Desk',len:'2 to 4 weeks'},
  5:{name:'Individual events',eg:'Rooted Beach Day, a Soul Night, Congo Fundraiser, one-off events',
    web:'Calendar page, a post, Weekly Bulletin',msg:'Ministry list',social:'Sprinkle promos',sun:'Bulletin slide, Welcome Desk',len:'2 to 4 weeks'},
};
const NOTS={1:[],2:['No sprint'],3:['No churchwide email or text','No sprint'],4:['No Sunday announcement','No churchwide email or text','No sprint'],5:['No Sunday announcement','No churchwide email or text','No sprint']};
const MINISTRY={Christmas:1,Easter:1,'Kick-Off Sunday':1,'Church Outside':1,'Love Your City':1,'Service time change':1,Serving:2,Volunteering:2,Giving:2,Baptism:2,'Discipleship Groups':2,'Newcomers Group':2,'First Impressions':2,'ONE80 Kids':3,'Ocean Youth':3,'Young Adults':3,Rooted:4,"Men's Group":4,'Congo Orphanage':4,'Crossroad Pregnancy Center':4,'Soul Nights Group':4,'Foster Care':4,'Prayer Ministry':4,'Outreach':4,'Missions':4};

const RULES=[
  ['Awareness is not interest','Knowing about it is not the goal. A next step is.'],
  ['Sunday is not your Savior','A stage announcement will not fix low attendance.'],
  ['The more you announce, the less they listen','When everything is emphasized, nothing feels important.'],
  ['Inspiration over information','Facts and details do not move people. Stories do.'],
  ['One destination for every promo','oceansidechurch.ca, the Next Steps button. Every time.'],
  ['Values dictate voice','How we say it matters as much as what we say.'],
];
const WORDS=[
  ['Stage','The one live announcement from the Sunday MC.'],
  ['The Booth','The short pre-recorded video segment on Sunday.'],
  ['Pre-service slide','The slide on screen before the service.'],
  ['Welcome Desk','Printed info and answers in the lobby.'],
  ['Weekly Bulletin','The weekly list of everything happening. Anything without a Sunday spot still shows up here.'],
  ['Ministry list','The people subscribed to that ministry\'s collection at oceansidechurch.ca/posts/collections. Each campaign sends its own email.'],
  ['Next Steps button','The one place every promo points to, at oceansidechurch.ca.'],
  ['Launcher','The quick-action menu on the website.'],
  ['Info Card','A card on the Next Steps page.'],
  ['Sprinkle','A post worth reading on its own, with the promo in the last line.'],
  ['Sprint','Up to 7 days of daily promo in the last week. Level 1 only, 2 to 4 times a year.'],
  ['Highlight week','A one-week spotlight on an always-on next step.'],
  ['The Handoff','An announcement that connects Sunday in the room with what is online.'],
  ['The Callback','An announcement that recaps last week and carries it forward.'],
  ['Smuggle','A Level 4 or 5 event mentioned from stage inside a real Level 2 ask, like serving.'],
];
// What someone can ask for, and what the policy answers at each level.
const ASKS={
  stage:{label:'Stage or Booth',rule:'Sunday is not your Savior',
    at:l=>l==1?['yes','The stage slot exists for this.','It gets an announcement most weeks of the 8-week plan, with rest weeks built in.']:
      l==2?['some','In rotation, not every week.','Launch and final week are the main announcements.']:
      l==3?['some','In the Booth at launch and in the final week.','Urgency lives in the language, not in more announcements.']:
      ['no','This level does not get a Sunday announcement.','It gets the Weekly Bulletin and its slide, the Welcome Desk, a post and the ministry list. In the final week, it can ride along under a Level 2 ask like serving.']},
  every:{label:'Every week',rule:'The more you announce, the less they listen',
    at:l=>['no','Nothing gets announced every week.',l==1?'Even Level 1 rests in weeks 2 and 5. That is what keeps people listening.':'The plan is built on rest weeks, with a fresh angle when it returns.']},
  email:{label:'Email the whole church',rule:'The more you announce, the less they listen',
    at:l=>l<=2?['yes','This level gets churchwide email and text.','On the schedule in the plan.']:
      ['no','This level goes to the ministry list.','It can still reach everyone through the Weekly Bulletin. Subscribe boxes at live events grow the list.']},
  social:{label:'Main church social',rule:'Inspiration over information',
    at:l=>l==1?['yes','Sprint and sprinkle promos.','One sprint of up to 7 days, 2 to 4 times a year.']:
      ['some','As a sprinkle.','The post stands on its own, and the promo is the last line.']},
  longer:{label:'A longer campaign',rule:'Awareness is not interest',
    at:l=>l==1?['no','Level 1 already gets the longest runway: 8 weeks.','Time goes to a better story, not more weeks.']:

  banner:{label:'Website banner',rule:'One destination for every promo',
    at:l=>l==1?['yes','In the final week.','The banner goes up with the sprint and comes down right after the event.']:
      ['no','Banners are for Level 1.',l<=3?'It gets the Launcher, its page and an Info Card.':l==4?'It gets an Info Card and its own posts.':'It gets a post and the Calendar page.']},

    at:()=>['no','Everything goes through the Next Steps button.','The sign-up can live behind it. We will put the link there.']},
};

const DB={campaigns:[],ticks:{},stories:{},sundays:{}};
let me='',code='',view={},cache={};
try{me=localStorage.getItem('pp-me')||'';code=localStorage.getItem('pp-code')||''}catch(e){}

function ingest(d){
  DB.campaigns=(d.campaigns||[]).map(c=>({...c,level:+c.level||0,weeks:+c.weeks||0,ongoing:!!c.ongoing&&c.ongoing!=='0'&&c.ongoing!=='false'}));
  DB.ticks=Object.fromEntries((d.ticks||[]).map(t=>[t.key,t]));
  DB.stories=Object.fromEntries((d.stories||[]).map(t=>[t.key,t]));
  DB.sundays=Object.fromEntries((d.sundays||[]).map(t=>[t.date,t]));
  cache={};
}
function dump(){return {campaigns:DB.campaigns,ticks:Object.values(DB.ticks),stories:Object.values(DB.stories),sundays:Object.values(DB.sundays)}}
function store(){cache={};try{localStorage.setItem(DEV?'pp-demo':'pp-data',JSON.stringify(dump()))}catch(e){}}

const pending=[];let flushing=false;
async function post(action,body){
  store();
  if(DEV)return;
  pending.push({action,...body});
  if(flushing)return;
  flushing=true;
  while(pending.length){
    const job=pending[0];
    try{
      const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...job,key:job.key||code})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error);
      pending.shift();
    }catch(e){pending.length=0;toast("That didn't save. Check your connection and try again.");await refresh(true);break}
  }
  flushing=false;
}
async function fetchAll(c){
  const r=await fetch(CONFIG.apiUrl+'?key='+encodeURIComponent(c));
  return r.json();
}
let lastJson='';
async function refresh(force){
  if(DEV||!code)return;
  if(!force&&(pending.length||$('#dlg').open||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)))return;
  try{
    const j=await fetchAll(code);
    if(!j.ok){if(j.error==='code'){code='';try{localStorage.removeItem('pp-code')}catch(e){}render()}return}
    const s=JSON.stringify(j);
    if(s===lastJson&&!force)return;
    lastJson=s;ingest(j);store();render();
  }catch(e){}
}

// ---------- plan ----------
const lengthOf=c=>c.level==1?8:(WEEKMAP[c.weeks]?c.weeks:4);
const active=()=>DB.campaigns.filter(c=>c.status==='active');
const dated=()=>active().filter(c=>!c.ongoing&&c.date);
const ongoing=()=>active().filter(c=>c.ongoing).sort((a,b)=>a.name.localeCompare(b.name));
const rotation=()=>ongoing().filter(c=>c.level==2);

function weeksOf(c){
  const k='w'+c.id;if(cache[k])return cache[k];
  const n=lengthOf(c),map=WEEKMAP[n],last=sunOf(c.date),pb=PB[c.level]||PB[5];
  return cache[k]=map.map((tw,i)=>({i:i+1,n,tw,sun:add(last,-(n-1-i)*7),...pb[tw]}));
}
const weekAt=(c,sun)=>weeksOf(c).find(w=>w.sun===sun);
const startOf=c=>weeksOf(c)[0].sun;
const sayKey=(c,w)=>`${c.id}~w${w.tw}~say`;

function tasksOf(c){
  const k='t'+c.id;if(cache[k])return cache[k];
  const out=[];
  PREP(c.level).forEach((label,j)=>out.push({key:`${c.id}~prep~${j}`,date:add(startOf(c),-3),ch:'prep',label,opt:false,c,w:'prep'}));
  weeksOf(c).forEach(w=>{
    if(w.say==='req'||w.say==='opt'){if(w.sun<=c.date)out.push({key:sayKey(c,w),date:w.sun,ch:'say',label:w.angle,opt:w.say==='opt',c,w:w.i,say:true})}
    w.tasks.forEach((t,j)=>{const date=add(w.sun,t[0]);if(date>c.date)return;
      out.push({key:`${c.id}~w${w.tw}~${t[1]}${j}`,date,ch:t[1],label:t[2],opt:!!t[3],c,w:w.i})});
  });
  AFTER(c.level).forEach((t,j)=>out.push({key:`${c.id}~after~${j}`,date:add(c.date,t[0]),ch:t[1],label:t[2],opt:false,c,w:'after'}));
  return cache[k]=out;
}
const isDone=k=>!!DB.ticks[k];
const openTasks=c=>tasksOf(c).filter(t=>!t.opt&&!isDone(t.key)&&!(t.date<(c.created||'')));

// Level 2 next steps with no end date take turns in a one-week highlight, every 4 to 6 weeks.
function highlightFor(sun){
  const list=rotation();if(!list.length)return null;
  const every=Math.max(4,Math.min(6,list.length));
  const idx=Math.round(D(sun)/6048e5)%every;
  const c=list[idx];
  return c?{c,hl:true,w:{angle:'Highlight week',i:0,n:0,sun,say:'req',tasks:HIGHLIGHT}}:null;
}
const itemSayKey=(it,sun)=>it.hl?`${it.c.id}~hl~${sun}`:sayKey(it.c,it.w);

function lineup(sun){
  const k='l'+sun;if(cache[k])return cache[k];
  const items=dated().filter(c=>c.date>=sun&&c.level).map(c=>({c,w:weekAt(c,sun)})).filter(x=>x.w);
  const byPri=(a,b)=>a.c.level-b.c.level||a.c.date.localeCompare(b.c.date);
  const req=items.filter(x=>x.w.say==='req').sort(byPri);
  const hl=highlightFor(sun);
  const optional=[...items.filter(x=>x.w.say==='opt').sort(byPri),...items.filter(x=>x.w.say==='smuggle').sort(byPri)];
  const all=[...req,...optional,...(hl?[hl]:[])];
  const find=id=>all.find(x=>x.c.id===id)||null;
  let stage,booth;
  const over=DB.sundays[sun];
  if(over){
    stage=over.stage?find(over.stage):null;
    booth=String(over.booth||'').split(',').filter(Boolean).map(find).filter(Boolean).slice(0,SLOTS.booth);
  }else{
    stage=req.find(x=>x.c.level<=2)||null;
    booth=req.filter(x=>x!==stage).slice(0,SLOTS.booth);
    // A highlight only fills a quiet Sunday. Otherwise it waits in the open slot's list.
    if(hl&&(stage?1:0)+booth.length<2){if(!stage)stage=hl;else booth.push(hl)}
  }
  const on=new Set([stage,...booth].filter(Boolean).map(x=>x.c.id));
  const bumped=req.filter(x=>!on.has(x.c.id));
  const spare=all.filter(x=>!on.has(x.c.id));
  const resting=items.filter(x=>!x.w.say&&x.c.level<=3).map(x=>x.c);
  const bulletin=items.filter(x=>x.c.level>=4).map(x=>x.c);
  return cache[k]={stage,booth,bumped,spare,resting,bulletin,count:on.size};
}

// Tasks that belong to the week, not to a campaign: one slide loop, one desk, one bulletin.
function sharedTasks(sun){
  const k='s'+sun;if(cache[k])return cache[k];
  const list=dated().filter(c=>c.level).map(c=>({c,w:weekAt(c,sun)})).filter(x=>x.w&&x.c.date>=sun);
  const names=f=>list.filter(x=>f(x.w)).sort((a,b)=>a.c.level-b.c.level).map(x=>x.c.name);
  const ns=rotation().length?['Next Steps']:[];
  const out=[];
  const slide=[...names(w=>w.slide),...ns],desk=[...names(w=>w.desk),...ns];
  const bull=[...list.filter(x=>x.w.bull).sort((a,b)=>(a.w.bull.startsWith('Featured')?0:1)-(b.w.bull.startsWith('Featured')?0:1)||a.c.level-b.c.level).map(x=>x.c.name),...ns];
  if(slide.length)out.push({key:'slide~'+sun,date:sun,ch:'slide',name:'Run the pre-service slides',list:slide});
  if(desk.length)out.push({key:'desk~'+sun,date:sun,ch:'desk',name:'Stock the Welcome Desk',list:desk});
  if(bull.length)out.push({key:'bulletin~'+sun,date:add(sun,4),ch:'bulletin',name:'Publish the Weekly Bulletin',list:bull});
  return cache[k]=out;
}

function highlightTasks(sun){
  const l=lineup(sun),it=[l.stage,...l.booth].find(x=>x&&x.hl);if(!it)return [];
  return HIGHLIGHT.map((t,j)=>({key:`${it.c.id}~hl~${sun}~${j}`,date:add(sun,t[0]),ch:t[1],label:t[2],opt:!!t[3],c:it.c,w:0}));
}

function dueBetween(from,to){
  const out=[];
  dated().forEach(c=>tasksOf(c).forEach(t=>{if(!t.say&&!t.opt&&t.date>=from&&t.date<=to)out.push(t)}));
  for(let s=sunOf(from);s<=to;s=add(s,7))highlightTasks(s).forEach(t=>{if(!t.opt&&t.date>=from&&t.date<=to)out.push(t)});
  return out;
}
function sharedBetween(from,to){
  const out=[];
  for(let s=sunOf(from);s<=to;s=add(s,7))sharedTasks(s).forEach(t=>{if(t.date>=from&&t.date<=to)out.push(t)});
  return out;
}
const overdue=()=>dated().flatMap(c=>tasksOf(c).filter(t=>!t.opt&&!t.say&&!isDone(t.key)&&t.date<TODAY&&t.date>=(c.created||''))).sort((a,b)=>a.date.localeCompare(b.date));

function stateOf(c){
  if(c.status==='done')return 'done';
  if(c.ongoing)return 'always';
  if(c.date<TODAY)return 'wrap';
  if(startOf(c)>TODAY)return 'next';
  return 'running';
}
const sprintsUsed=y=>DB.campaigns.filter(c=>c.level==1&&c.status!=='request'&&c.date&&c.date.startsWith(String(y))).length;

const CHGROUP={sunday:['say','slide','desk'],email:['email'],text:['text'],social:['social','fb'],web:['web'],bulletin:['bulletin']};
function groupsFor(tasks,shared,says){
  const byC={};tasks.forEach(t=>(byC[t.c.id]=byC[t.c.id]||{c:t.c,ts:[]}).ts.push(t));
  const camp=Object.values(byC).sort((a,b)=>a.c.level-b.c.level||a.c.name.localeCompare(b.c.name)).map(({c,ts})=>
    `<div class="group"><a class="group-h" href="#/c/${esc(c.id)}">${esc(c.name)}</a>${ts.map(t=>todo(t.key,t.label)).join('')}</div>`).join('');
  const sunGroup=says||'';
  const sh=shared.length?`<div class="group"><span class="group-h">Every campaign</span>${shared.map(t=>todo(t.key,t.name,t.list.join(', '))).join('')}</div>`:'';
  return sunGroup+camp+sh;
}
function sayGroup(sun){
  const l=lineup(sun),items=[[l.stage,'Stage'],...l.booth.map(x=>[x,'Booth'])].filter(x=>x[0]);
  if(!items.length)return '';
  return `<div class="group"><a class="group-h" href="#/sunday/${sun}">Sunday announcements</a>${items.map(([it,where])=>todo(itemSayKey(it,sun),`${where}: ${it.c.name}`,DB.stories[`${it.c.id}~${sun}`]?it.w.angle:`${it.w.angle}, needs a story`)).join('')}</div>`;
}
function weekList(from,to,chan,mark){
  const keep=t=>!chan||(CHGROUP[chan]||[]).includes(t.ch);
  const due=dueBetween(from,to).filter(keep),shared=sharedBetween(from,to).filter(keep);
  const says=!chan||chan==='sunday';
  const evs=chan?[]:dated().filter(c=>c.date>=from&&c.date<=to);
  const dates=new Set([...due.map(t=>t.date),...shared.map(t=>t.date),...evs.map(c=>c.date)]);
  if(says)for(let d=sunOf(from);d<=to;d=add(d,7))if(d>=from&&lineup(d).count)dates.add(d);
  return [...dates].sort().map(d=>{
    const ev=evs.filter(c=>c.date===d);
    const gs=groupsFor(due.filter(t=>t.date===d),shared.filter(t=>t.date===d),says&&D(d).getDay()===0?sayGroup(d):'');
    return `<section class="day"><div class="day-h">${esc(fmt(d,{weekday:'long',month:'short',day:'numeric'}))}${d===TODAY?'<span class="tg">Today</span>':''}${ev.length?`<span class="ev">Event: ${ev.map(c=>esc(c.name)).join(', ')}</span>`:''}</div>${gs?`<div class="groups">${gs}</div>`:''}</section>`}).join('');
}
function weekCount(from,to,chan){
  const keep=t=>!chan||(CHGROUP[chan]||[]).includes(t.ch);
  let n=dueBetween(from,to).filter(keep).filter(t=>!isDone(t.key)).length+sharedBetween(from,to).filter(keep).filter(t=>!isDone(t.key)).length;
  if(!chan||chan==='sunday')for(let d=sunOf(from);d<=to;d=add(d,7))if(d>=from){const l=lineup(d);n+=[l.stage,...l.booth].filter(Boolean).filter(it=>!isDone(itemSayKey(it,d))).length}
  return n;
}
function pageTodo(){
  const list=dated();
  const running=list.filter(c=>['running','wrap'].includes(stateOf(c))).sort((a,b)=>a.level-b.level||a.date.localeCompare(b.date));
  const later=list.filter(c=>stateOf(c)==='next').sort((a,b)=>startOf(a).localeCompare(startOf(b)));
  const starting=later.filter(c=>startOf(c)<=add(TODAY,21));
  const asks=DB.campaigns.filter(c=>c.status==='request');
  const end=nextSun(TODAY),chan=view.schedCh||'';
  const inWeek=dueBetween(TODAY,end).filter(t=>!isDone(t.key)).length+sharedBetween(TODAY,end).filter(t=>!isDone(t.key)).length;
  const l=lineup(end),says=[l.stage,...l.booth].filter(Boolean).filter(it=>!isDone(itemSayKey(it,end))).length;
  const n=inWeek+says;
  const late=overdue();
  const head=n?`<em>${n===1?'One thing':cap(word(n))+' things'}</em> to do this week.`:`<em>Nothing left</em> to do this week.`;
  const opts=[['','Everything'],['sunday','Sunday'],['email','Email'],['text','Text'],['social','Social'],['web','Website'],['bulletin','Bulletin']];
  const weeks=view.schedWeeks||6;
  let more='';
  const wkOpen=view.wkOpen=view.wkOpen||new Set([add(end,1)]);
  for(let i=1,s=add(end,1);i<weeks;i++,s=add(s,7)){
    const to=add(s,6),cnt=weekCount(s,to,chan);
    if(!cnt&&!dated().some(c=>c.date>=s&&c.date<=to))continue;
    const on=wkOpen.has(s);
    more+=`<section><button class="wk-h" data-act="wkToggle" data-s="${s}" aria-expanded="${on}"><span class="chev${on?' on':''}">${I(ICON.right,15)}</span><h2>${i===1?'Next week':`Week of ${esc(long(s))}`}</h2><span class="mute">${cnt?`${cnt} to do`:'All done'}</span></button>${on?weekList(s,to,chan):''}</section>`;
  }
  const thisWeek=weekList(TODAY,end,chan);
  return chrome('todo',`
  <h1>${head}</h1>
  ${asks.length?`<div class="asks">${asks.map(c=>`<div class="ask"><div><b>${esc(c.name)}</b><div class="mute">Request${c.requester?` from ${esc(c.requester)}`:''}, ${c.date?esc(full(c.date)):'ongoing'}${c.level?`, looks like Level ${c.level}`:''}</div>${c.notes?`<div style="margin-top:3px">${esc(c.notes)}</div>`:''}</div><button class="btn solid" data-act="triage" data-id="${esc(c.id)}">Set the level</button></div>`).join('')}</div>`:''}
  ${starting.length?`<div class="starts">${starting.map(startCard).join('')}</div>`:''}
  <div class="home"><div>
    ${late.length?`<section class="overdue"><h2>${late.length} overdue</h2>${groupsFor(late,[],'')}<button class="btn bare" data-act="skipLate" style="padding:0;margin-top:6px">Clear all ${late.length}</button></section>`:''}
    <div class="sect-head" style="flex-wrap:wrap"><h2>This week</h2><div class="choices">${opts.map(([k,lb])=>`<button class="choice" style="min-height:34px;padding:0 12px;font-size:14.5px" data-act="schedCh" data-k="${k}" aria-pressed="${k===chan}">${lb}</button>`).join('')}</div></div>
    <div class="todo-weeks"><div>${thisWeek||'<p class="empty">Nothing due.</p>'}</div>${more}</div>
    <button class="btn" data-act="schedMore" style="margin-top:20px">Show 6 more weeks</button>
  </div>
  <aside>
    <div class="side-h"><h2>Running</h2><a class="btn bare" href="#/timeline" style="min-height:0">Timeline</a></div>
    <div class="runlist">${running.length?running.map(campRow).join(''):'<p class="empty">Nothing running.</p>'}</div>
    ${later.length>starting.length?`<h2 class="upnext" style="margin:22px 0 8px">Up next</h2>${later.filter(c=>!starting.includes(c)).slice(0,6).map(c=>`<a class="compact upnext" href="#/c/${esc(c.id)}">${esc(c.name)}<span>Starts ${esc(fmt(startOf(c)))}</span></a>`).join('')}`:''}
  </aside></div>`);
}
function startCard(c){
  const st=startOf(c);
  const ts=tasksOf(c).filter(t=>(t.w==='prep'||t.w===1)&&!t.opt&&!t.say&&t.date<=st);
  return `<article class="startcard"><div class="start-info"><div><span class="when">Starts ${esc(full(st))}</span><h3>${esc(c.name)}</h3><span class="when">Level ${c.level}, event ${esc(fmt(c.date))}</span></div><a class="more" href="#/c/${esc(c.id)}">See the full plan</a></div>
    <div>${ts.map(t=>todo(t.key,t.label,t.date<st?`By ${shortDay(t.date)}`:'')).join('')}</div></article>`;
}
function campRow(c){
  const w=weekNow(c),next=nextTask(c),late=lateCount(c),wrap=stateOf(c)==='wrap';
  return `<a class="camp" href="#/c/${esc(c.id)}"><div class="camp-top"><b>${esc(c.name)}</b><span>${esc(fmt(c.date))}</span></div>${pbar(c)}
    <div class="camp-where">${wrap?'Wrap up':w?`Week ${w.i} of ${w.n}, ${esc(angleOf(w,c))}`:''}</div>
    ${late?`<div class="camp-next late">${late} overdue</div>`:next?`<div class="camp-next">Next: ${esc(next.say?'Announce on '+fmt(next.date):next.label+', '+shortDay(next.date))}</div>`:'<div class="camp-next">All done</div>'}</a>`;
}

// ---------- timeline ----------
const TL_COL=()=>innerWidth<760?96:118;
function pageTimeline(){
  const list=dated().filter(c=>stateOf(c)!=='done').sort((a,b)=>startOf(a).localeCompare(startOf(b))||a.level-b.level);
  const running=list.filter(c=>['running','wrap'].includes(stateOf(c))).length;
  const open=view.tlOpen||new Set();
  const done=DB.campaigns.filter(c=>c.status==='done'&&c.date);
  const yr=TODAY.slice(0,4);
  const COL=TL_COL(),NAME=innerWidth<760?116:220;
  const first=add(sunOf(TODAY),-7);
  const lastEv=list.length?list.map(c=>c.date).reduce((a,b)=>a>b?a:b):add(first,70);
  const n=Math.max(10,Math.round((D(sunOf(lastEv))-D(first))/6048e5)+3);
  const W=n*COL,x=d=>Math.round((D(d)-D(first))/864e5*COL/7);
  const wks=[];for(let i=0;i<n;i++)wks.push(add(first,i*7));
  const nowSun=sunOf(TODAY);
  const head=wks.map(s=>`<div class="tl-wk${s===nowSun?' this':''}"><b>${s===nowSun?'This week':''}</b>${esc(fmt(s))}</div>`).join('');
  const rows=list.map(c=>{
    const ws=weeksOf(c),H=c.level==1?62:c.level<=3?54:44,st=startOf(c);
    const segs=[];
    if(add(st,-7)>=first)segs.push(`<a class="seg first ph-prep" href="#/c/${esc(c.id)}" style="left:${x(add(st,-7))}px;width:${COL-2}px">Get ready</a>`);
    ws.forEach((w,i)=>{if(w.sun<first)return;const end=i===ws.length-1?add(c.date,1):add(w.sun,7),wd=Math.max(COL*.25,x(end)-x(w.sun))-2;
      const cls=[phaseClass(w,c),i===ws.length-1?'last':''].join(' ');
      segs.push(`<a class="seg ${cls}" href="#/c/${esc(c.id)}" style="left:${x(w.sun)}px;width:${wd}px" title="${esc(fmt(w.sun))}: ${esc(angleOf(w,c))}, ${esc(w.phase)}">${angleOf(w,c).length*7+16<wd?esc(angleOf(w,c)):''}</a>`)});
    const flag=`<span class="tl-flag" style="left:${x(add(c.date,1))}px">${esc(fmt(c.date))}</span>`;
    const isOpen=open.has(c.id);
    let detail='';
    if(isOpen){
      const cells=wks.map(s=>{
        const ts=tasksOf(c).filter(t=>!t.opt&&sunOf(t.date)===s);
        const sh=sharedTasks(s).filter(t=>t.list.includes(c.name));
        return `<div class="tl-cell${s===nowSun?' this':''}">${ts.map(t=>todo(t.key,t.say?`Announce: ${t.label}`:t.label)).join('')}${sh.map(t=>todo(t.key,t.name.replace('Run the pre-service slides','Slide').replace('Stock the Welcome Desk','Welcome Desk').replace('Publish the Weekly Bulletin','Bulletin'))).join('')}</div>`}).join('');
      detail=`<div class="tl-detail"><div class="tl-name" style="background:var(--paper)"><a href="#/c/${esc(c.id)}" style="font-size:14px">Open campaign</a></div><div class="tl-cells">${cells}</div></div>`;
    }
    const late=lateCount(c);
    return `<div class="tl-row"><button class="tl-name" data-act="tlOpen" data-id="${esc(c.id)}" aria-expanded="${isOpen}"><b><span class="chev${isOpen?' on':''}">${I(ICON.right,13)}</span>${esc(c.name)}</b><small>${late?`<span style="color:var(--red)">${late} overdue</span>`:nextTask(c)?`Next ${esc(fmt(nextTask(c).date))}`:'All done'}, Level ${c.level}</small></button><div class="tl-track tl-grid" style="width:${W}px;min-height:${H}px">${segs.join('')}${flag}</div></div>${detail}`;
  }).join('');
  return chrome('timeline',`
  <div class="head"><h1><em>${running===1?'One':cap(word(running))}</em> running, <em>${word(list.length-running)}</em> up next.</h1><span class="mute" style="font-size:16px">${sprintsUsed(yr)} of 4 sprints used in ${yr}</span></div>
  <div class="tl-bar"><div class="legend">${LEGEND}</div><button class="btn" data-act="tlAll">${open.size?'Collapse all':'Show all tasks'}</button></div>
  ${list.length?`<div class="tl" style="--col:${COL}px;--name:${NAME}px"><div class="tl-in" style="width:${W+NAME}px"><div class="tl-now" style="left:${NAME+x(nowSun)}px"></div>
    <div class="tl-head"><div class="tl-name"></div><div class="tl-weeks tl-grid" style="width:${W}px">${head}</div></div>${rows}</div></div>`:'<p class="empty">No campaigns yet. Tap + to add one.</p>'}
  ${ongoing().length?`<section class="sect"><div class="sect-head"><h2>Always on</h2></div><div class="always">${ongoing().map(c=>`<a class="${c.id===highlightFor(nextSun(TODAY))?.c.id?'on':''}" href="#/c/${esc(c.id)}">${esc(c.name)}</a>`).join('')}</div></section>`:''}
  ${done.length?`<section class="sect"><div class="sect-head"><h2>Done</h2></div><div class="always">${done.map(c=>`<a href="#/c/${esc(c.id)}">${esc(c.name)}</a>`).join('')}</div></section>`:''}
  <section class="sect"><a class="btn bare" href="#/ask" style="padding:0 12px 0 0">Open request form</a><button class="btn bare" data-act="copyAsk">Copy link</button></section>`);
}

// ---------- one campaign: laid out like the playbook, one row per week ----------
function pageCampaign(id){
  const c=DB.campaigns.find(x=>x.id===id);
  if(!c)return chrome('timeline','<p class="empty">This campaign is gone.</p>');
  if(c.ongoing)return pageOngoing(c);
  const ws=weeksOf(c),now=weekNow(c),state=stateOf(c),next=nextTask(c),ts=tasksOf(c);
  const field=state==='done'||!now?'ph-prep':phaseClass(now,c);
  const where=state==='done'?'Done':state==='wrap'?'Wrap up':state==='next'?`Starts ${full(startOf(c))}`:`Week ${now.i} of ${now.n}, ${now.phase}: ${angleOf(now,c)}`;
  const strip=[`<a class="ph-prep" href="#pw-prep" data-jump="pw-prep">Get ready<small>${esc(fmt(add(startOf(c),-3)))}</small></a>`,
    ...ws.map(w=>`<a class="${phaseClass(w,c)}${now===w?' now':''}" href="#pw-${w.i}" data-jump="pw-${w.i}">${esc(angleOf(w,c))}<small>${esc(fmt(w.sun))}</small></a>`),
    `<a class="ph-after" href="#pw-after" data-jump="pw-after">Wrap up<small>${esc(fmt(add(c.date,1)))}</small></a>`].join('');
  const prep=ts.filter(t=>t.w==='prep');
  const prepRow=rowShell('pw-prep',`<div class="pw-date">${esc(shortDay(prep[0].date))}</div><span class="pw-tag ph-prep">Get ready</span>`,
    `<div class="pw-col">${prep.map(t=>todo(t.key,t.label)).join('')}</div>`,state==='next'&&startOf(c)<=add(TODAY,14),state!=='next'&&(prep.every(t=>isDone(t.key))||prep[0].date<(c.created||''))?`Get ready, ${shortDay(prep[0].date)}`:'');
  const after=ts.filter(t=>t.w==='after');
  const allAfter=after.every(t=>isDone(t.key));
  const afterRow=rowShell('pw-after',`<div class="pw-date">${esc(fmt(c.date))}</div><span class="pw-tag ph-after">Wrap up</span><div class="pw-why">Show it was worth attending, and clean up expired promos straight away.</div>`,
    `<div class="pw-col"><h4>${esc(fmt(c.date,{weekday:'long'}))}</h4>${after.filter(t=>t.date===c.date).map(t=>todo(t.key,t.label)).join('')}</div>
     <div class="pw-col"><h4>${esc(fmt(add(c.date,1),{weekday:'long'}))}</h4>${after.filter(t=>t.date!==c.date).map(t=>todo(t.key,t.label)).join('')}</div>
     <div class="pw-col">${state==='done'?`<button class="btn" data-act="reopen" data-id="${esc(c.id)}">Reopen</button>`:c.date<=TODAY?`<button class="btn${allAfter?' solid':''}" data-act="close" data-id="${esc(c.id)}">Close campaign</button>`:''}</div>`,state==='wrap','');
  return chrome('timeline',`
  <section class="cz ${field}">
    <div class="cz-top"><a class="back" href="#/timeline" aria-label="Timeline">${I(ICON.left)}</a><span class="spacer"></span>
      <button class="btn" data-act="reply" data-id="${esc(c.id)}">Reply to ministry</button><button class="btn" data-act="edit" data-id="${esc(c.id)}">Edit</button></div>
    <div><h1>${esc(c.name)}</h1><p class="cz-date">${esc(full(c.date))}, Level ${c.level}</p>
    <p class="cz-now">${esc(where)}</p>${next&&state!=='done'?`<div class="cz-next"><span>Next</span>${todo(next.key,next.say?`Announce: ${next.label}`:next.label,shortDay(next.date))}</div>`:''}</div>
  </section>
  <div class="strip">${strip}</div>
  ${prepRow}${ws.map(w=>weekRow(c,w,now)).join('')}${afterRow}
  ${c.notes||c.contact?`<section class="sect" style="max-width:68ch"><h2 style="margin-bottom:6px">Notes</h2>${c.contact?`<p class="mute">Contact: ${esc(c.requester?c.requester+', ':'')}${esc(c.contact)}</p>`:''}<p>${esc(c.notes||'')}</p></section>`:''}`);
}
function rowShell(id,left,right,isNow,collapsed){
  if(collapsed)return `<div class="pw-done" id="${id}">${I(ICON.check,16)}<span>${esc(collapsed)}</span></div>`;
  return `<section class="pw${isNow?' now':''}" id="${id}"><div>${isNow?'<span class="pw-tag tw">This week</span>':''}${left}</div><div class="pw-cols">${right}</div></section>`;
}
function weekRow(c,w,now){
  const ts=tasksOf(c).filter(t=>t.w===w.i);
  const shared=sharedTasks(w.sun).filter(t=>t.list.includes(c.name));
  const say=ts.find(t=>t.say);
  const dayTasks=d=>ts.filter(t=>!t.say&&D(t.date).getDay()===d);
  const isNow=now===w;
  const past=add(w.sun,6)<TODAY;
  const openCount=ts.filter(t=>!t.opt&&!isDone(t.key)&&t.date>=(c.created||'')).length;
  const skipped=past&&!openCount;
  if(skipped)return rowShell('pw-'+w.i,'','',false,`${fmt(w.sun)}: ${angleOf(w,c)}`);
  const l=lineup(w.sun),it=[l.stage,...l.booth].find(x=>x&&x.c.id===c.id);
  const where=it?(l.stage===it?'Stage':'Booth'):'';
  const storyKey=`${c.id}~${w.sun}`,story=DB.stories[storyKey]?.story;
  let sayHTML='';
  if(say){
    sayHTML=todo(say.key,`Announce: ${say.label}`,where||(say.opt?'':'Bumped to the bulletin this Sunday'),say.opt);
    if(it)sayHTML+=`<button class="storyline" data-act="story" data-id="${esc(c.id)}" data-sun="${w.sun}">${story?esc(story):'<u>Add the story</u>'}</button>`;
  }
  const sh=k=>shared.filter(t=>t.ch===k).map(t=>todo(t.key,t.name.replace('Run the pre-service slides','Run the slide').replace('Publish the Weekly Bulletin','Weekly Bulletin'),k==='bulletin'?w.bull:'')).join('');
  const col=(h,inner)=>`<div class="pw-col"><h4>${h}</h4>${inner||'<span class="note">Nothing</span>'}</div>`;
  const row=t=>todo(t.key,t.label,'',t.opt);
  const left=`<div class="pw-date">${esc(fmt(w.sun))}</div><span class="pw-tag ph-${esc(w.phase)}">${esc(w.phase)}</span><div class="pw-angle">${esc(angleOf(w,c))}</div><div class="pw-why">${esc(WHYWEEK[c.level]?.[w.tw]||'')}</div>`;
  const right=col('Sunday',sayHTML+dayTasks(0).map(row).join('')+sh('slide')+sh('desk'))+col('Tuesday',dayTasks(2).map(row).join(''))+col('Thursday',sh('bulletin'));
  return rowShell('pw-'+w.i,left,right,isNow,'');
}
function pageOngoing(c){
  const sundays=[];
  if(c.level==2)for(let s=nextSun(TODAY),i=0;i<26&&sundays.length<4;i++,s=add(s,7)){const h=highlightFor(s);if(h&&h.c.id===c.id)sundays.push(s)}
  const every=c.level==2?'Pre-service slide, Welcome Desk, Launcher action, web page, Weekly Bulletin':LEVEL[c.level]?.web||'';
  return chrome('timeline',`
  <section class="cz ph-prep"><div class="cz-top"><a class="back" href="#/timeline" aria-label="Timeline">${I(ICON.left)}</a><span class="spacer"></span><button class="btn" data-act="edit" data-id="${esc(c.id)}">Edit</button></div>
    <div><h1>${esc(c.name)}</h1><p class="cz-date">Always on, Level ${c.level}</p></div></section>
  <section class="pw" style="margin-top:20px"><div><div class="pw-angle">Every week</div></div><div><p style="font-size:18px">${esc(every)}</p></div></section>
  ${sundays.length?`<section class="pw"><div><div class="pw-angle">Highlight weeks</div></div><div class="rail">${sundays.map(s=>`<a href="#/sunday/${s}">${esc(fmt(s))}</a>`).join('')}</div></section>`:''}`);
}

// ---------- sunday ----------
function pageSunday(sun){
  const cur=nextSun(TODAY);
  sun=sun||cur;
  const l=lineup(sun);
  const when=sun===TODAY?'today':sun===cur?'on Sunday':'on '+long(sun);
  const n=l.count;
  const head=n===1?`Say <em>one thing</em> ${when}.`:n===0?`Say <em>nothing</em> ${when}.`:`Say <em>${word(n)} things</em> ${when}.`;
  const rail=[];for(let i=-1;i<=5;i++){const s=add(sun,i*7);rail.push(`<a href="#/sunday/${s}" aria-current="${s===sun}">${esc(fmt(s))}<small>${lineup(s).count} of 3</small></a>`)}
  const q=[];
  if(l.bumped.length)q.push(['Bumped to the bulletin',l.bumped.map(x=>x.c)]);
  if(l.bulletin.length)q.push(['Bulletin only',l.bulletin]);
  if(l.resting.length)q.push(['Resting',l.resting]);
  return chrome('sunday',`
  <h1>${head}</h1>
  <div class="rail" style="margin:16px 0 clamp(18px,3vw,28px)">${rail.join('')}</div>
  <div class="slots">
    ${slot('stage','Stage',l.stage,sun,l)}
    ${slot('booth','Booth',l.booth[0],sun,l)}
    ${slot('booth','Booth',l.booth[1],sun,l)}
  </div>
  ${q.length?`<dl class="quiet">${q.map(([t,cs])=>`<div><dt>${t}</dt><dd>${cs.map(c=>`<a href="#/c/${esc(c.id)}">${esc(c.name)}</a>`).join(', ')}</dd></div>`).join('')}</dl>`:''}`);
}
function slot(kind,label,it,sun,l){
  if(!it){
    const can=l.spare.length>0;
    return `<button class="slot slot-open${can?'':' locked'}" ${can?`data-act="fill" data-sun="${sun}" data-kind="${kind}"`:'disabled'}>${can?`<span class="plus">${I(ICON.plus)}</span>`:''}<span>${label} open</span></button>`;
  }
  const c=it.c,w=it.w,key=itemSayKey(it,sun),story=DB.stories[`${c.id}~${sun}`]?.story;
  const prev=lineup(add(sun,-7)),repeat=[prev.stage,...prev.booth].some(x=>x&&x.c.id===c.id);
  const sub=[it.hl?'':`Week ${w.i} of ${w.n}`,it.hl||w.phase===w.angle?'':w.phase,repeat?'also last Sunday':''].filter(Boolean).join(', ');
  return `<article class="slot ${kind} ${it.hl?'ph-prep':'ph-'+w.phase}"><div class="slot-top"><span class="tag">${label}</span><a class="btn bare" href="#/c/${esc(c.id)}" style="min-height:0">Plan</a></div>
    <div style="display:grid;gap:14px"><button class="slot-name" data-act="story" data-id="${esc(c.id)}" data-sun="${sun}">${esc(c.name)}</button>
    <div class="slot-foot"><b>${esc(w.angle)}</b>${sub?`<span class="sub">${esc(sub)}</span>`:''}
    <p data-act="story" data-id="${esc(c.id)}" data-sun="${sun}" role="button" tabindex="0">${story?esc(story):'<span class="story">Add the story</span>'}</p>${todo(key,'Announced')}</div></div></article>`;
}
function storySheet(id,sun){
  const c=DB.campaigns.find(x=>x.id===id);if(!c)return;
  const l=lineup(sun),it=[l.stage,...l.booth].find(x=>x&&x.c.id===id);
  const key=`${id}~${sun}`;
  const earlier=Object.values(DB.stories).filter(s=>s.key.startsWith(id+'~')&&s.key!==key).sort((a,b)=>b.key.localeCompare(a.key));
  openDlg(`<form class="sheet" id="storyForm"><div class="sheet-head"><div><h2>${esc(c.name)}</h2><p class="sheet-sub">${esc(long(sun))}${it?`, ${esc(it.w.angle)}`:''}</p></div>${closeBtn()}</div>
    <label class="f">One story<textarea name="story" rows="5">${esc(DB.stories[key]?.story||'')}</textarea></label>
    <div><span class="lbl">One next step</span><span>${esc(CONFIG.nextStep)}</span></div>
    ${earlier.length?`<div><span class="lbl" style="margin-bottom:6px">Already told</span><ul class="earlier">${earlier.map(s=>`<li>${esc(s.story)}<span>${esc(long(s.key.split('~').pop()))}</span></li>`).join('')}</ul></div>`:''}
    <div class="sheet-foot">${it?`<button type="button" class="btn bare left" data-act="takeOff" data-id="${esc(id)}" data-sun="${sun}">Take off this Sunday</button>`:''}<button class="btn solid">Save</button></div></form>`);
  $('#storyForm').onsubmit=e=>{e.preventDefault();const v=e.target.story.value;withName(()=>{saveStory(key,v);closeDlg();render()})};
}
function fillSheet(sun,kind){
  const l=lineup(sun);
  openDlg(`<div class="sheet"><div class="sheet-head"><h2>${kind==='stage'?'Stage':'Booth'}, ${esc(long(sun))}</h2>${closeBtn()}</div>
    <div class="opts">${l.spare.map(x=>`<button class="opt-row" data-act="fillPick" data-id="${esc(x.c.id)}" data-sun="${sun}" data-kind="${kind}">${esc(x.c.name)}<span>${x.hl?'Highlight week':x.w.say==='smuggle'?'Under a Level 2 ask':esc(x.w.angle)}</span></button>`).join('')}</div></div>`);
}

// ---------- rules ----------
function pageRules(){
  const camps=dated();
  const lvl=view.askLevel||4,ask=view.ask||'stage';
  const a=ASKS[ask],[v,headline,instead]=a.at(lvl);
  const big={no:'No',yes:'Yes',some:'Sometimes'}[v];
  const rowsM=[['Website','web'],['Email and text','msg'],['Social','social'],['Sunday','sun'],['Length','len']];
  return chrome('rules',`
  <h1>Who gets <em>what</em>.</h1>
  <div class="matrix-wrap" style="margin-top:clamp(18px,3vw,28px)"><table class="matrix"><thead><tr><th></th>${[1,2,3,4,5].map(l=>`<th class="${l===lvl?'sel':''}">Level ${l}<small>${esc(LEVEL[l].name)}</small></th>`).join('')}</tr></thead>
    <tbody><tr><th>For example</th>${[1,2,3,4,5].map(l=>`<td class="${l===lvl?'sel':''}">${esc(LEVEL[l].eg)}</td>`).join('')}</tr>${rowsM.map(([t,k])=>`<tr><th>${t}</th>${[1,2,3,4,5].map(l=>`<td class="${l===lvl?'sel':''}">${esc(LEVEL[l][k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <section class="sect"><h2 style="font:300 clamp(30px,3.6vw,46px)/1.05 var(--sans);letter-spacing:-.03em;margin-bottom:18px">Someone asked for <em style="font-style:normal;font-weight:700">more</em>?</h2>
    <div class="steps-ask">
      <div><div class="step-n">1. What is it?</div><div class="choices">${[1,2,3,4,5].map(l=>`<button class="choice" data-act="askLevel" data-l="${l}" aria-pressed="${l===lvl&&!view.askCamp}">Level ${l}</button>`).join('')}</div>
        ${camps.length?`<div class="choices" style="margin-top:6px">${camps.sort((x,y)=>x.level-y.level).map(c=>`<button class="choice" style="min-height:34px;font-size:14.5px;padding:0 12px" data-act="askPick" data-l="${c.level}" data-id="${esc(c.id)}" aria-pressed="${view.askCamp===c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}</div>
      <div><div class="step-n">2. What do they want?</div><div class="choices">${Object.entries(ASKS).map(([k,x])=>`<button class="choice" data-act="askWhat" data-k="${k}" aria-pressed="${k===ask}">${esc(x.label)}</button>`).join('')}</div></div>
      <div><div class="step-n">3. The answer</div><div class="verdict" aria-live="polite"><div class="big">${big}. ${esc(headline)}</div><p class="instead">${esc(instead)}</p><p class="because">Policy: ${esc(a.rule)}</p><div><button class="btn solid" data-act="copyVerdict">Copy reply</button></div></div></div>
    </div></section>
  <section class="sect"><div class="sect-head"><h2>The limits</h2></div><div class="rules"><div><b>1 on stage, 2 in the Booth.</b><span>Three or fewer each Sunday, one story and one next step each.</span></div><div><b>Sprints, 2 to 4 a year.</b><span>Level 1 only, 7 days at most.</span></div><div><b>Sunday, Tuesday, Thursday.</b><span>Booth and slides, then email and social, then the Weekly Bulletin.</span></div></div></section>
  <section class="sect"><div class="sect-head"><h2>The policy</h2></div><div class="rules">${RULES.map(([t,d])=>`<div><b>${esc(t)}.</b><span>${esc(d)}</span></div>`).join('')}</div></section>
  <section class="sect"><div class="sect-head"><h2>Words we use</h2></div><dl class="gloss">${WORDS.map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl></section>`);
}
const rung=(sel,act)=>l=>`<button class="rung l${l}" data-act="${act}" data-l="${l}" aria-pressed="${l===sel}"><span>Level ${l}</span><small>${esc(LEVEL[l].name)}</small></button>`;
function replyFor(c,opts={}){
  const hi=c&&c.requester?`Hi ${c.requester.split(' ')[0]},`:'Hi,';
  const l=c?c.level:opts.level,L=LEVEL[l];
  const lines=[hi,''];
  if(c){
    lines.push(`Thanks for sending ${c.name}. It's a Level ${l} (${L.name.toLowerCase()}), so here's how we'll promote it:`,'');
    lines.push(`Website: ${L.web}`,`Email and text: ${L.msg}`,`Social: ${L.social}`,`Sunday: ${L.sun}`,`Length: ${L.len}`,'');
    if(c.date)lines.push(`Promo starts ${full(startOf(c))}.`,'');
    lines.push(`Every promo points to one place: the Next Steps button at oceansidechurch.ca.`,'',`Have a story from this ministry? Send it over. A story moves people more than details do, and it's the best thing you can give us.`);
  }else{
    const a=ASKS[opts.ask],[,headline,instead]=a.at(l);
    lines.push(`Thanks for caring about this. Here's how our communications policy handles it.`,'',`${headline} ${instead}`,'',`We use the same levels for every ministry, so nothing gets drowned out: ${a.rule.toLowerCase()}.`,'',`Have a story from this ministry? Send it over. A story moves people more than details do.`);
  }
  return lines.join('\n');
}

function planList(level,weeks,date){
