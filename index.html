<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promo Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap">
<style>
/* Direction: soft white, charcoal text, dark purple as the primary, violets for the playbook phases.
   Electric violet marks launches, today and finished tasks. Red means overdue.
   Spare accent colours, not in use: spring #6FDB3C, forest #173F24. */
:root{
  --paper:#F7F6FB;--white:#fff;--ink:#222226;--ink2:#2A1147;--violet:#7143FE;--red:#C8321F;
  --aw:#E0DBFB;--in:#9569FE;--ur:#7143FE;--accent:#7143FE;--on-accent:#fff;--neutral:#ECEAF3;--indigo:#18062A;--pale:#F0EDFD;
  --band:#E8E5F2;--mute:#66666E;--line:rgba(34,34,38,.14);--faint:rgba(34,34,38,.06);--tilemute:rgba(34,34,38,.68);
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --gutter:clamp(16px,3vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
[hidden]{display:none!important}

/* ---------- frame ---------- */
.top{display:flex;align-items:center;gap:14px;padding:16px var(--gutter);max-width:1280px;margin:0 auto}
.logo{font-size:22px;font-weight:700;letter-spacing:-.03em;text-decoration:none;margin-right:auto}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--faint)}
.nav a[aria-current=page]{background:var(--indigo);color:#fff}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--violet);color:#fff;font-size:12.5px;font-weight:700}
.who{color:var(--mute);font-size:14px}
.fab{width:42px;height:42px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:none}
.fab:hover{background:var(--ink2)}
main{padding:clamp(8px,1.6vw,18px) var(--gutter) 72px;max-width:1280px;margin:0 auto}
h1{font:300 clamp(32px,3.8vw,52px)/1.08 var(--sans);letter-spacing:-.03em;text-wrap:balance}
h1 em{font-style:normal;font-weight:700;color:var(--indigo)}
h2{font:600 20px/1.2 var(--sans);letter-spacing:-.015em}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 40px;margin-bottom:clamp(16px,2vw,22px)}
.sect{margin-top:clamp(36px,5vw,60px)}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;font-weight:600;background:var(--white);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--band)}
.btn.solid{background:var(--indigo);color:#fff}
.btn.solid:hover{background:var(--ink2)}
.btn.bare{background:none;padding:0 6px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.bare:hover{background:none;color:var(--mute)}
.flag{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 15px;border-radius:99px;background:var(--white);color:var(--red);font-weight:600;font-size:15px;text-decoration:none}

/* colour = playbook phase */
.ph-Awareness{background:var(--aw);color:var(--ink)}
.ph-Interest{background:var(--in);color:var(--ink)}
.ph-Urgency{background:var(--ur);color:#fff;--tilemute:rgba(255,255,255,.85);--mute:rgba(255,255,255,.85);--line:rgba(255,255,255,.3)}
.ph-prep{background:var(--neutral);color:var(--ink)}
.ph-rest{background:repeating-linear-gradient(135deg,var(--neutral) 0 2px,var(--white) 2px 9px);color:var(--ink)}
.ph-after{background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:22px;height:12px;border-radius:4px;display:block}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.l1{background:var(--indigo);color:#fff}
.l2{background:var(--violet);color:#fff}
.l3{background:var(--in);color:var(--ink)}
.l4{background:var(--aw);color:var(--ink)}
.l5{background:var(--neutral);color:var(--ink)}

/* to-do item: the one control in the app that means "do this" */
.todo{display:flex;align-items:flex-start;gap:10px;width:100%;padding:6px 0;line-height:1.3;border-radius:8px}
.box{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.22);display:grid;place-items:center;flex:none;transition:box-shadow .12s,background .12s}
.todo:hover .box{box-shadow:inset 0 0 0 2px var(--ink)}
.todo.on .box{background:var(--indigo);color:#fff;box-shadow:none}
.todo-t{min-width:0;padding-top:1px}
.todo-t small{display:block;font-size:14px;color:var(--mute);line-height:1.3}
.todo.on .todo-t{color:var(--mute);text-decoration:line-through}
.todo.on .todo-t small{text-decoration:none}
.todo .opt{color:var(--mute)}
.tw{display:flex;align-items:flex-start;gap:8px}
.tw .todo{flex:1;min-width:0}
.tasklink{font-size:14px;font-weight:600;color:var(--violet);padding-top:7px;white-space:nowrap;flex:none}
.linkbtn{flex:none;width:28px;height:28px;margin-top:3px;border-radius:50%;display:grid;place-items:center;color:var(--mute);opacity:.55}
.linkbtn:hover,.linkbtn:focus-visible{background:var(--band);opacity:1}

/* ---------- campaign marks ---------- */
.rk{display:inline-grid;place-items:center;transition:translate .18s ease}
.block .bh .rk,.cc-ic .rk,.cz-kicker .rk{background:var(--accent);color:var(--on-accent);border-radius:9px;padding:3px}
.lvl{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:7px;background:var(--white);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.tg{font-size:12.5px;font-weight:600;background:var(--accent);color:var(--on-accent);padding:1px 8px;border-radius:99px;white-space:nowrap}
.sels{display:flex;flex-wrap:wrap;gap:8px}
.sel{display:inline-flex;align-items:center;gap:8px;background:var(--white);border-radius:12px;padding:0 6px 0 12px;font-size:14.5px;color:var(--mute);min-height:40px}
.sel select{min-height:38px;padding:0 6px;background:none;border-radius:8px;font-size:15px;font-weight:600;color:var(--ink);max-width:230px;width:auto}
.overview{margin-top:clamp(18px,2.4vw,26px)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.ccard{display:grid;gap:9px;align-content:start;background:var(--white);border-radius:18px;padding:12px 14px;text-decoration:none}
.ccard:hover{background:var(--aw)}
.ccard.soon{outline:1.5px dashed var(--violet);outline-offset:-1.5px}
.cc-head{display:flex;align-items:flex-start;gap:10px}
.cc-ic{flex:none;margin-top:1px}
.cc-name{flex:1;min-width:0}
.cc-name b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.cc-name small{display:block;font-size:14px;color:var(--mute);line-height:1.3;margin-top:2px}
.cc-mid .pbar{margin:0 0 5px}
.cc-where{font-size:14px;line-height:1.25;color:var(--mute)}
.cc-foot{display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.3}
.cc-next{color:var(--mute)}
.stat{font-weight:600}
.stat.late{color:var(--red)}
.clist{display:grid;gap:8px;margin-top:14px}
.ccard.wide{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:12px 26px;background:var(--white);box-shadow:none;padding:16px 20px}
.ccard.wide:hover{background:var(--band)}
.ccard.wide .cc-name b{font-size:18px}

/* task blocks: one per campaign, full width, with a heavy heading so a campaign can't be mistaken for a task */
.todo-sec{margin-top:clamp(24px,3vw,36px)}
.todo-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.blocks{display:grid;gap:10px}
.block{border-radius:20px;background:var(--white);overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:9px 16px;text-decoration:none;background:var(--pale);color:var(--ink)}
a.bh:hover b{text-decoration:underline}
.bh-t{flex:1;min-width:0}
.bh-t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.bh-t small{display:block;font-size:14px;line-height:1.25;opacity:.82;margin-top:1px}
.bh-ic{flex:none;display:grid;place-items:center}
.bh-wh{font-size:14.5px;font-weight:500;white-space:nowrap}
.block.plain .bh{color:var(--ink)}
.block.plain .bh{background:var(--neutral)}
.bb{padding:4px 16px 8px}
.bd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;padding:6px 0}
.bd+.bd{border-top:1px solid var(--faint)}
.bd.nodate{grid-template-columns:minmax(0,1fr)}
.bd-date{font-size:14.5px;font-weight:600;padding-top:7px;line-height:1.3}
.bd-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:0 18px}
.dayg{margin-bottom:20px}
.dayg .day-h{margin-bottom:10px}
.nextstep{display:grid;gap:1px;margin-top:14px;background:var(--white);border-radius:18px;padding:12px 18px;font-size:17px}
.nextstep span{font-size:14.5px;color:var(--mute)}
.nextstep b{font-weight:600}
.mc-tools{display:flex;flex-wrap:wrap;gap:6px;padding:14px var(--gutter) 0;max-width:760px;margin:0 auto}
.mc{max-width:720px;margin:0 auto;padding:clamp(24px,5vw,56px) 20px 40px;display:grid;gap:20px}
.mc-date{font-size:18px;color:var(--mute)}
.mc-item{background:var(--white);border-radius:24px;padding:18px 22px;display:grid;gap:8px;justify-items:start}
.mc-item h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.03em;line-height:1.05}
.mc-item .tag{background:var(--aw)}
.mc-angle{font-weight:600}
.mc-story{font-size:clamp(19px,2.6vw,23px);line-height:1.42}
.sun-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.cz-kicker{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:600}

/* ---------- to do page ---------- */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px;font-size:18px}
.flag.solid{background:var(--red);color:var(--white)}
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:clamp(24px,3.4vw,48px);align-items:start;margin-top:clamp(22px,3vw,36px)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:clamp(22px,3vw,34px)}
.startcard{background:var(--ink);color:var(--white);border-radius:28px;padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px 28px}
.start-info{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.startcard h3{margin:0;font:600 clamp(26px,2.6vw,34px)/1.05 var(--sans);letter-spacing:-.03em}
.startcard .when{font-size:15px;opacity:.8}
.startcard .box{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.startcard .todo:hover .box{box-shadow:inset 0 0 0 2px var(--white)}
.startcard .todo.on .box{background:var(--white);color:var(--ink)}
.startcard .todo-t small,.startcard .todo.on .todo-t{color:rgba(255,255,255,.65)}
.startcard a.more{color:var(--white);font-weight:600;text-underline-offset:3px}
.todo-weeks{display:grid;gap:clamp(18px,2.4vw,26px)}
.wk-h{display:flex;align-items:baseline;gap:6px;width:100%;margin-bottom:10px}
.wk-h .mute{margin-left:auto;font-size:15.5px}
.day{padding-top:12px;border-top:1px solid var(--line)}
.day+.day{margin-top:18px}
.day-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:18px;font-weight:700;letter-spacing:-.012em;margin-bottom:8px}
.day-h .tg{font-size:13px;font-weight:600;background:var(--ink);color:var(--white);padding:2px 9px;border-radius:99px;letter-spacing:0}
.day-h .ev{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.group{background:var(--white);border-radius:20px;padding:12px 16px 8px}
.group-h{display:block;font-weight:700;line-height:1.2;margin-bottom:4px;text-decoration:none}
a.group-h:hover{text-decoration:underline}
.empty{padding:14px 0;color:var(--mute);font-size:18px}
.overdue{background:var(--white);border-radius:24px;padding:14px 18px;margin-bottom:22px;box-shadow:inset 0 0 0 1.5px var(--red)}
.overdue h2{color:var(--red);margin-bottom:8px}
.overdue .group{background:none;padding:6px 0 0}
.side-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.camp{display:block;background:var(--white);border-radius:22px;padding:14px 16px;text-decoration:none;margin-bottom:8px}
.camp:hover{background:var(--band)}
.camp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.camp-top b{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.camp-top span{font-size:14.5px;color:var(--mute);white-space:nowrap}
.pbar{display:flex;gap:2px;margin:9px 0 8px;height:9px;align-items:stretch}
.pbar i{flex:1;border-radius:3px;min-width:0}
.pbar i.past{opacity:.35}
.pbar i.now{box-shadow:0 0 0 2px var(--ink);z-index:1}
.camp-where{font-size:14.5px;color:var(--mute);line-height:1.3}
.camp-next{font-size:15.5px;font-weight:500;line-height:1.3;margin-top:2px}
.camp-next.late{color:var(--red)}
.compact{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-top:1px solid var(--line);text-decoration:none}
.compact:hover{text-decoration:underline}
.compact span{color:var(--mute);white-space:nowrap}
.requests{margin-top:clamp(20px,3vw,30px)}
.requests h2{margin-bottom:10px}
.asks{display:grid;gap:8px}
.ask-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--aw)}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--white);border-radius:22px;padding:12px 14px 12px 18px;box-shadow:inset 0 0 0 1.5px var(--violet)}
.ask>div{flex:1;min-width:200px}
.ask b{font-size:18px;font-weight:700}

/* ---------- timeline ---------- */
.tl-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tl{overflow-x:auto;background:var(--white);border-radius:26px;padding-bottom:14px}
.tl-in{position:relative}
.tl-grid{--g:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--col));background-image:var(--g),var(--g);background-size:calc(2*var(--col) - 1px) 100%,100% 100%;background-position:0 0,calc(3*var(--col)) 0;background-repeat:no-repeat}
.tl-now{position:absolute;top:0;bottom:0;width:calc(2*var(--col));background:rgba(113,67,254,.07);pointer-events:none}
.tl-head{display:flex;position:sticky;top:0}
.tl-name{position:sticky;left:0;z-index:3;flex:none;width:var(--name);background:var(--white);padding:6px 8px 6px 16px;box-shadow:1px 0 0 var(--line);display:block}
button.tl-name{cursor:pointer}
button.tl-name:hover b{text-decoration:underline}
.tl-name b{display:block;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.tl-lv{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--pale);color:var(--ink2);font-size:11.5px;font-weight:700;line-height:1.3;letter-spacing:0;vertical-align:1px;white-space:nowrap}
.tl-name small{display:block;font-size:13px;color:var(--mute);line-height:1.25;margin-top:1px}
.tl-weeks{display:flex;height:52px}
.tl-wk{width:var(--col);flex:none;padding:8px 0 0 8px;font-size:14px;line-height:1.2}
.tl-wk b{display:block;font-weight:700;font-size:13px;height:16px;color:var(--violet)}
.tl-wk.this{font-weight:700;width:calc(2*var(--col))}
.tl-row{display:flex;align-items:stretch;border-top:1px solid var(--faint)}
.tl-track{position:relative;flex:none;min-height:54px}
.seg{position:absolute;top:8px;bottom:8px;display:flex;align-items:center;padding:0 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-decoration:none;border-radius:4px;color:var(--ink)}
.seg svg{flex:none;margin-right:4px}
.seg.first{border-radius:12px 4px 4px 12px}
.seg.last{border-radius:4px 12px 12px 4px}
.seg.ph-Urgency{color:#fff}
.seg:hover{filter:brightness(.95)}
.cz .btn{background:#fff;color:var(--ink)}
.cz .btn:hover{background:var(--aw)}
.tl-flag{position:absolute;top:50%;translate:0 -50%;background:var(--indigo);color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;margin-left:5px}
.tl-detail{display:flex;border-top:1px dashed var(--line);background:var(--paper)}
.tl-cells{display:flex;flex:none}
.tl-cell{width:var(--col);flex:none;padding:8px 7px 10px;font-size:13px}
.tl-cell.this{background:rgba(113,67,254,.07);width:calc(2*var(--col))}
.tl-day{font-size:12.5px;font-weight:700;line-height:1.2;margin:10px 0 3px}
.tl-day:first-child{margin-top:0}
.tl-day.past{color:var(--grey)}
.tl-corner{display:flex;align-items:flex-end;padding-bottom:8px}
.tl-wk{position:relative}
.tl-n{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--pale);color:var(--ink2);font-size:11.5px;font-weight:700;line-height:1.5;vertical-align:1px}
.tl-n.busy{background:var(--ur);color:#fff}
.tl-later{position:absolute;top:50%;translate:0 -50%;margin-left:8px;font-size:13px;color:var(--mute);white-space:nowrap;text-decoration:none}
.tl-first{font-size:13px;color:var(--mute);white-space:nowrap;padding-left:3px}
.tl-cells.f .tl-cell{padding:7px 5px 3px}
.tl-cells.f .tl-cell.this{background:none}
a.tl-name{text-decoration:none;color:var(--ink)}
.tl-chip{display:block;background:var(--pale);border-radius:7px;padding:4px 7px;margin-bottom:4px;font-size:12.5px;line-height:1.2;color:var(--ink);text-decoration:none}
.tl-chip:hover{filter:brightness(.96)}
.tl-chip b{font-weight:700}
.tl-chip.opt{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.tl-chip.lead{background:var(--ur);color:#fff}
.tl-chip.done{opacity:.5;text-decoration:line-through}
.legend i.lg-ev{background:var(--indigo);border-radius:99px}
.tl-cell .todo{gap:6px;padding:4px 0;font-size:13px;line-height:1.2}
.tl-cell .box{width:15px;height:15px}
.tl-cell .box svg{width:10px;height:10px}
.tl-cell .todo-t small{display:none}
.chev{display:inline-block;transition:rotate .12s;color:var(--mute);margin-right:2px}
.chev.on{rotate:90deg}
.always{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:18px}
.always a{text-decoration:none}
.always a:hover{text-decoration:underline}
.always .on{font-weight:700}

/* ---------- one campaign ---------- */
.cz{background:linear-gradient(100deg,#18062A 0%,#2A1147 52%,#4A25B0 84%,#7143FE 100%);color:#fff;--mute:rgba(255,255,255,.8);border-radius:26px;padding:14px 16px 20px clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:14px}
.cz-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cz .btn{min-height:40px;padding:0 16px}
.cz-top .spacer{flex:1}
.back{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;margin-left:calc(-1 * clamp(0px,1.2vw,10px))}
.cz h1{font:600 clamp(30px,3.6vw,48px)/1.05 var(--sans);letter-spacing:-.03em}
.cz-date{margin-top:6px;font-size:17px;font-weight:400}
.cz-now{margin-top:2px;font-size:15.5px;opacity:.85;line-height:1.3}
.cz-next{color:var(--ink);--mute:#66666E;display:inline-flex;align-items:center;gap:12px;background:var(--white);border-radius:18px;padding:7px 18px 7px 14px;margin-top:12px;max-width:100%}
.cz-next>span{font-size:14.5px;color:var(--mute)}
.strip{position:relative;display:flex;gap:3px;margin:10px 0 14px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:1 0 78px;border-radius:9px;padding:7px 9px;text-decoration:none;font-size:13px;line-height:1.2;font-weight:600}
.strip a small{display:block;font-weight:400;font-size:13px}
.strip a.now{box-shadow:inset 0 0 0 2px var(--ink)}
.pw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(14px,2.4vw,30px);padding:14px 0;border-top:1px solid var(--line);scroll-margin-top:12px}
.pw.now{background:var(--white);border-radius:24px;border:0;padding:18px 20px;margin:6px -4px}
.pw-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px}
.pw-when{display:inline-flex;align-items:center;gap:8px}
.pw-date{font-size:17px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.pw-tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pw-tag.tw{background:var(--indigo);color:#fff}
.pw-tag.nx{background:var(--aw);color:var(--ink)}
.said-past{opacity:.55}
.edit-bar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--white);border-radius:99px;padding:6px 6px 6px 18px;margin:12px 0;box-shadow:0 2px 14px rgba(24,6,42,.1)}
.edit-bar .spacer{flex:1}
.pw-pb{font-size:13px;color:var(--mute);margin-top:1px}
.seg.early span{overflow:hidden;text-overflow:ellipsis}
.held{padding:4px 0 4px 32px;color:var(--mute)}
.held .todo-t{display:block}
.rank-btn{margin-left:auto;min-height:0}
.kind{display:flex;flex-wrap:wrap;gap:8px}
.tw.removed{justify-content:space-between;align-items:center;padding:4px 0}
.pw-angle{font-size:16px;font-weight:600;margin-top:6px;line-height:1.2}
.pw-why{font-size:14.5px;color:var(--mute);line-height:1.32;margin-top:3px}
.pw-also{grid-column:1/-1;font-size:14px;color:var(--mute);margin-top:2px}
.pw-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2vw,24px);align-content:start}
.pw-col h4{margin:0 0 4px;font-size:14.5px;font-weight:400;color:var(--mute)}
.pw-col .note{font-size:14.5px;color:var(--mute)}
.pw-done{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);color:var(--mute)}
.linkish{font-size:14.5px;text-decoration:underline;text-underline-offset:3px;padding:0 0 4px 32px;display:block;color:var(--ink)}
.storyline{font-size:14.5px;padding:0 0 6px 32px;color:var(--ink);display:block;width:100%}
label.f{display:grid;gap:6px;font-weight:600}
input[type=text],input[type=date],input[type=email],input[type=password],input:not([type]),select,textarea{width:100%;min-height:50px;padding:12px 16px;border:0;border-radius:16px;background:var(--white);font-weight:400;font-size:16px}
textarea{line-height:1.4;resize:vertical;min-height:110px}

/* ---------- sunday ---------- */
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.railbar{display:flex;align-items:center;gap:8px;margin:12px 0 clamp(14px,2vw,20px)}
.rail-scroll{position:relative;flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.rail-scroll::-webkit-scrollbar{display:none}
.railbar .arrow{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--white)}
.railbar .arrow:hover{background:var(--band)}
.railbar .btn{flex:none}
.rail a,.rail button{padding:8px 14px;border-radius:99px;background:var(--white);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap;flex:none}
.rail a:hover,.rail button:hover{background:var(--band)}
.rail a[aria-current=true],.rail button[aria-current=true]{background:var(--ink);color:var(--white)}
.rail small{font-size:13px;opacity:.65;margin-left:5px}
.slots{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.slot{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:250px;padding:16px 18px;border-radius:24px;width:100%}
.slot.stage{background:var(--indigo);color:#fff;--tilemute:rgba(255,255,255,.85);--mute:rgba(255,255,255,.85);--line:rgba(255,255,255,.3)}
.slot.booth{background:var(--aw);color:var(--ink)}
.slot.stage .box{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.slot.stage .todo.on .box{background:#fff;color:var(--ink);box-shadow:none}
.slot.stage .todo.on .todo-t{color:rgba(255,255,255,.75)}
.slot-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.slot-acts{display:flex;align-items:center;gap:16px}
.tag{color:var(--ink);display:inline-flex;align-items:center;min-height:30px;padding:0 13px;border-radius:99px;background:var(--white);font-weight:600;font-size:14.5px}
.slot-open{align-items:center;justify-content:center;gap:10px;color:var(--mute);text-align:center;font-weight:500;box-shadow:inset 0 0 0 1.5px var(--line)}
.slot-open:hover{background:var(--faint)}
.slot-open.locked{cursor:default}
.slot-open.locked:hover{background:none}
.slot-open .plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--white);color:var(--ink)}
.slot-name{display:block;font:600 clamp(24px,2.2vw,30px)/1.08 var(--sans);letter-spacing:-.025em;text-wrap:balance;width:100%}
.stage .slot-name{font-size:clamp(30px,3.2vw,42px);line-height:1.05;letter-spacing:-.03em}
.slot-foot{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.slot-foot b{font-weight:700}
.slot-foot .sub{color:var(--tilemute);font-size:14.5px}
.slot-foot .story{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.slot-foot p{margin:0;line-height:1.36;cursor:pointer;font-size:16px}
.quiet{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 32px;margin-top:20px}
.quiet dt{color:var(--mute);font-size:14.5px}
.quiet dd{font-size:17px;line-height:1.35}
.quiet dd a{text-decoration:none}
.quiet dd a:hover{text-decoration:underline}

/* ---------- rules ---------- */
.matrix-wrap{overflow-x:auto;background:var(--white);border-radius:24px;padding:6px 8px}
.matrix{border-collapse:collapse;width:100%;min-width:720px;font-size:15px;line-height:1.3}
.matrix th,.matrix td{padding:11px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--faint)}
.matrix thead th{border:0;font-weight:700;font-size:16px}
.matrix thead small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.matrix tbody th{font-weight:400;color:var(--mute);width:110px}
.steps-ask{display:grid;gap:18px;max-width:900px}
.step-n{font-weight:600;font-size:16px;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{min-height:42px;padding:0 16px;border-radius:99px;background:var(--white);font-weight:500}
.choice:hover{background:var(--band)}
.choice[aria-pressed=true]{background:var(--ink);color:var(--white)}
.lbl{font-weight:600;display:block}
.verdict{border-radius:22px;padding:clamp(18px,2.2vw,24px);display:grid;gap:10px;background:var(--white)}
.verdict .big{font:600 clamp(22px,2.2vw,28px)/1.15 var(--sans);letter-spacing:-.02em}
.verdict .instead{font-size:16.5px;line-height:1.38;max-width:60ch}
.verdict .because{color:var(--mute)}
.ladder{display:grid;gap:7px}
.rung{display:flex;align-items:center;gap:14px;width:100%;border-radius:18px;padding:0 18px;font-weight:600;letter-spacing:-.015em;min-height:52px;font-size:17px}
.rung small{margin-left:auto;font-weight:400;font-size:14.5px;letter-spacing:0;text-align:right}
.rung[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.rung:hover{filter:brightness(.95)}
.owners{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.gets{display:grid;gap:15px}
.gets dt{color:var(--mute);font-size:14.5px}
.gets dd{font-size:18px;font-weight:500;line-height:1.3}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px}
.rules b{display:block;font:600 19px/1.15 var(--sans);letter-spacing:-.018em}
.rules span{display:block;margin-top:3px;color:var(--mute);max-width:44ch}

/* ---------- sheets ---------- */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);border-radius:32px;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto}
dialog::backdrop{background:rgba(17,17,17,.4)}
dialog[open]{animation:rise .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.sheet{display:grid;gap:18px;padding:clamp(20px,3vw,30px)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.sheet h2{font:600 clamp(28px,3.4vw,38px)/1.08 var(--sans);letter-spacing:-.035em}
.sheet-sub{margin-top:5px;font-size:17px;color:var(--mute)}
.x{width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center;flex:none}
.x:hover{background:var(--band)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.sheet-foot .left{margin-right:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.echo{font-weight:500;margin-top:-6px}
.echo:empty{display:none}
.earlier{display:grid;gap:9px;font-size:15px}
.earlier li span{display:block;color:var(--mute);font-size:14px}
.opts{display:grid;gap:7px}
.opt-row{display:flex;align-items:center;gap:12px;background:var(--white);padding:13px 18px;border-radius:18px;width:100%;font-weight:600}
.opt-row:hover{background:var(--band)}
.opt-row span{margin-left:auto;font-weight:400;color:var(--mute);font-size:14.5px;text-align:right}
.reply{min-height:320px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--ink);color:var(--white);padding:12px 20px;border-radius:99px;font-weight:500;z-index:50;white-space:nowrap}

/* ---------- small joys ---------- */
.spark{position:fixed;z-index:60;width:7px;height:7px;margin:-3.5px;border-radius:50%;pointer-events:none;animation:spark .55s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.todo.pop .box{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.wkbar{display:flex;align-items:center;gap:14px;margin-top:12px;max-width:560px}
.wkbar-track{position:relative;flex:1;height:8px;border-radius:9px;background:var(--neutral)}
.wkbar-track i{display:block;height:100%;border-radius:9px;background:var(--indigo);transition:width .45s cubic-bezier(.3,1,.4,1)}
.wkbar-rk{position:absolute;top:50%;margin:-15px 0 0 -13px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:left .45s cubic-bezier(.3,1,.4,1);rotate:90deg}
.wkbar-rk svg{width:16px;height:16px}
.wkbar-n{font-size:14.5px;color:var(--mute);white-space:nowrap}
.btn,.choice,.fab,.helpbtn,.x,.arrow{transition:transform .12s,background .12s}
.btn:active,.choice:active,.fab:active,.helpbtn:active,.x:active,.arrow:active{transform:scale(.95)}
.fab:hover{transform:rotate(90deg)}
.fab{transition:transform .22s cubic-bezier(.3,1.4,.5,1),background .12s}
.ccard,.q-opt,.camp{transition:transform .14s,background .14s}
.ccard:hover,.q-opt:hover{transform:translateY(-2px)}
a:hover .rk{animation:wiggle .4s ease}
@keyframes wiggle{25%{rotate:-8deg}75%{rotate:8deg}}
.liftoff{color:var(--violet);animation:liftoff 1.1s cubic-bezier(.5,0,.4,1) both}
@keyframes liftoff{0%{transform:translateY(40px);opacity:0}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}

/* ---------- fields ---------- */
.dp{display:grid;gap:6px}
.dp-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:0 16px;background:var(--white);border-radius:16px;font-size:16px}
.dp-btn:hover{background:var(--band)}
.dp-btn.empty span{color:var(--mute)}
.dp-cal{background:var(--white);border-radius:20px;padding:12px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-head b{font-size:17px;font-weight:600}
.dp-head .arrow{margin:0;width:42px;height:42px}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.dp-grid span{font-size:13px;color:var(--mute);padding:4px 0}
.dp-grid button{height:44px;border-radius:12px;text-align:center;font-size:16px}
.dp-grid button:hover{background:var(--band)}
.dp-grid button.out{color:var(--mute);opacity:.55}
.dp-grid button.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.dp-grid button.sel{background:var(--ink);color:var(--white);opacity:1}
.dp-err{color:var(--red);font-weight:600;font-size:15px}
.combo-list{display:grid;gap:0;background:var(--white);border-radius:16px;padding:5px;margin-top:2px;font-weight:400}
.combo-list button{display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center;padding:0 12px;border-radius:11px;width:100%;font-size:16px}
.combo-list button:hover{background:var(--band)}
.combo-list span{color:var(--mute);font-size:14px}

/* ---------- questionnaire ---------- */
.quiz{display:grid;gap:18px;padding:clamp(18px,3vw,28px)}
.solo .quiz{padding:0}
.q-top{display:flex;align-items:center;gap:10px}
.q-top .segs{flex:1;color:var(--ink);height:5px}
.q-top .segs i{height:4px}
.q-top .segs i.past{height:4px}
.q-text{font:300 clamp(29px,4vw,40px)/1.08 var(--sans);letter-spacing:-.03em;text-wrap:balance}
.q-text em{font-style:normal;font-weight:700}
.q-opts{display:grid;gap:8px}
.q-opt{display:block;width:100%;background:var(--white);border-radius:22px;padding:16px 20px}
.q-opt:hover{background:var(--ink);color:var(--white)}
.q-opt:hover span{color:var(--white)}
.q-opt b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.q-opt span{display:block;margin-top:2px;font-size:14.5px;color:var(--mute)}
.q-why{font-size:18px;line-height:1.35;max-width:48ch}
.examples{background:var(--white);border-radius:16px;padding:10px 16px}
.examples summary{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.examples ul{display:grid;gap:10px;margin-top:10px}
.examples li{font-size:15.5px;line-height:1.32}
.examples b{display:block;font-size:14px;color:var(--mute);font-weight:500}
.q-story{background:var(--white);border-radius:18px;padding:12px 16px;line-height:1.35}
.q-story span{display:block;font-size:14px;color:var(--mute)}
.q-story small{display:block;font-size:14px;color:var(--mute);margin-top:3px}
.q-result{border-radius:28px;padding:20px 22px}
.q-result small{display:block;font-size:15px}
.q-result b{display:block;font:600 clamp(36px,5vw,52px)/1 var(--sans);letter-spacing:-.04em;margin-top:3px}
.q-result p{margin-top:10px;font-size:16px;line-height:1.35}
.plan-list{display:grid;gap:0;background:var(--white);border-radius:22px;padding:6px 18px}
.plan-list li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 0}
.plan-list li+li{box-shadow:0 -1px 0 var(--faint)}
.plan-list time{font-weight:600}
.plan-list b{font-weight:600}
.plan-list span{display:block;font-size:14.5px;color:var(--mute);line-height:1.3}
.nots{display:grid;gap:3px;font-size:15px;color:var(--mute)}

/* ---------- walkthrough ---------- */
dialog.tourd{width:min(680px,calc(100vw - 32px))}
.tour{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding:clamp(16px,2.6vw,24px);min-height:min(600px,calc(100dvh - 64px))}
.tour-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tour-dots{display:flex;gap:5px;flex:1;max-width:240px}
.tour-dots i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.tour-dots i.on{background:var(--ink)}
.tour h2{font:300 clamp(34px,5vw,50px)/1.04 var(--sans);letter-spacing:-.035em;text-wrap:balance}
.tour h2 em{font-style:normal;font-weight:700}
.tour-body{display:grid;align-content:start;gap:16px}
.tour-body>p{font-size:18px;line-height:1.38;max-width:50ch}
.tour-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini-hero{border-radius:26px;background:linear-gradient(100deg,#18062A,#2A1147 60%,#7143FE);color:#fff;padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.mini-hero b{font:600 clamp(30px,5vw,44px)/1 var(--sans);letter-spacing:-.04em}
.mini-ladder{display:grid;gap:5px}
.mini-ladder div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:15px;padding:0 15px;font-weight:600}
.mini-ladder small{font-weight:400;font-size:14px;text-align:right}
.mini-ladder .m1{min-height:64px;font-size:21px}
.mini-ladder .m2,.mini-ladder .m3{min-height:50px;font-size:17px}
.mini-ladder .m4{min-height:42px}
.mini-ladder .m5{min-height:36px;font-size:14.5px}
.mini-slots{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.mini-slots div{border-radius:20px;padding:13px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;line-height:1.1}
.mini-slots small{font-weight:500;font-size:13.5px}
.mini-slots b{font-size:clamp(16px,2.6vw,23px);font-weight:600;letter-spacing:-.02em}
.mini-slots .open{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute)}
.mini-tl{background:var(--white);border-radius:20px;padding:14px;display:grid;gap:8px}
.mini-tl div{display:flex;gap:2px;height:30px}
.mini-tl i{flex:1;border-radius:4px;font-style:normal;font-size:12px;font-weight:600;padding:7px 5px;overflow:hidden;white-space:nowrap}
.mini-week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-week div{background:var(--white);border-radius:20px;padding:13px}
.mini-week b{display:block;font-weight:700;margin-bottom:3px}
.mini-week span{display:block;font-size:14.5px;color:var(--mute);line-height:1.28}
.tour .group{max-width:340px}
.seq{display:grid;gap:0;background:var(--white);border-radius:22px;padding:6px 18px;counter-reset:s}
.seq li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);padding:9px 0;align-items:baseline}
.seq li::before{content:counter(s);font-weight:700}
.seq li+li{box-shadow:0 -1px 0 var(--faint)}
.seq span{color:var(--mute);display:block;font-size:14.5px;line-height:1.3}
.helpbtn{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-weight:600;font-size:18px;flex:none}
.helpbtn:hover{background:var(--faint)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 40px}
.gloss dt{font-weight:700}
.gloss dd{color:var(--mute);line-height:1.35}

/* ---------- gate + request ---------- */
.solo{min-height:100dvh;display:grid;align-content:center;gap:28px;width:min(560px,100%);margin:0 auto;padding:32px 20px}
.solo form{display:grid;gap:14px}
.err{font-weight:600;background:var(--white);color:var(--red);padding:10px 16px;border-radius:14px}
.hp{position:absolute;left:-9999px}

<script>
// ---------- config ----------
const CONFIG={
  apiUrl:'https://script.google.com/macros/s/AKfycbyw3XD1HUN6u9dIVqykMZcT5G-2EUO5rjRi9RsyG7AbV8jMMCye_0Ay9ssTmYQ29OsF4w/exec', // Apps Script web app (see apps-script/Code.gs)

};
const SLOTS={stage:1,booth:2};

// ---------- dates ----------
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const S=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const x=D(s);x.setDate(x.getDate()+n);return S(x)};

const fmt=(s,o)=>D(s).toLocaleDateString('en-CA',o||{month:'short',day:'numeric'});
const long=s=>fmt(s,{month:'long',day:'numeric'});
const isPhone=()=>innerWidth<760;
const weekSpan=s=>{const e=add(s,6);return `${fmt(s)} – ${e.slice(0,7)===s.slice(0,7)?D(e).getDate():fmt(e)}`};
const full=s=>fmt(s,{weekday:'long',month:'long',day:'numeric'});
const TODAY=(DEV&&qs.get('today'))||S(new Date());
const nextSun=s=>D(s).getDay()===0?s:add(sunOf(s),7);
const DAYN={0:'Sunday',1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'};
const WORD=['nothing','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const word=n=>WORD[n]??String(n);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

// ---------- icons ----------
const I=(p,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={

const ASSETLIST=(weeks,tasks,add)=>{const use={},weekOf=d=>[...weeks].reverse().find(w=>w.sun<=d)||weeks[0],mark=(a,w,date,opt)=>{const u=use[a[0]];if(!u)use[a[0]]={slug:a[0],name:a[1],spec:a[2],date:add(w.sun,-3),first:date,opt};else{if(!opt)u.opt=false;if(date<u.first){u.first=date;u.date=add(w.sun,-3)}}};weeks.forEach(w=>ASSETFLAGS.forEach(a=>{if(w[a[3]])mark(a,w,w.sun,false)}));tasks.forEach(t=>{if(t.say||t.ch==='prep')return;const w=weekOf(t.date);ASSETS.forEach(a=>{if(a[3](t,w))mark(a,w,t.date,!!t.opt)})});return Object.values(use).sort((a,b)=>a.first.localeCompare(b.first))};
const RANKWEEKS=(ts,over,add,sunOf)=>{const out={};['social','msg'].forEach(kind=>{const items=ts.filter(t=>t.kind===kind);if(!items.length)return;const suns=items.map(t=>sunOf(t.date)),last=suns.reduce((a,b)=>a>b?a:b);let s=suns.reduce((a,b)=>a<b?a:b),carry=[];for(;s<=last||carry.length;s=add(s,7)){const sun=s,here=[...items.filter(t=>sunOf(t.date)===sun),...carry.filter(t=>add(sun,2)<=t.end)];carry.filter(t=>add(sun,2)>t.end).forEach(t=>{out[t.key]={date:t.date,rank:'hold',hold:1,kind}});carry=[];const ids=[...new Set(here.map(t=>t.id))],pri=id=>{const m=here.filter(t=>t.id===id);return [m.every(t=>t.opt)?1:0,m[0].level,m[0].end]};ids.sort((a,b)=>{const x=pri(a),y=pri(b);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2])});const want=String(over[kind+'~'+sun]||'').split(',').filter(x=>ids.includes(x)),lead=want.length?want[0]:ids.find(id=>pri(id)[1]<=3)||null,sprinkle=want.length>1?want[1]:ids.filter(id=>id!==lead)[0]||null;here.forEach(t=>{const moved=sunOf(t.date)!==sun,date=moved?add(sun,2):t.date;if(t.id===lead)out[t.key]={date,rank:'lead',moved,from:t.date,kind};else if(t.id===sprinkle)out[t.key]={date,rank:'sprinkle',lead,moved,from:t.date,kind};else if(t.opt||t.fixed)out[t.key]={date:t.date,rank:'hold',hold:1,kind};else carry.push(t)})}});return out};

// ---------- state ----------
const DB={campaigns:[],ticks:{},stories:{},sundays:{},owners:{},mcToken:''};
let me='',code='',view={},cache={};
try{me=localStorage.getItem('pp-me')||'';code=localStorage.getItem('pp-code')||''}catch(e){}

function ingest(d){
  DB.campaigns=(d.campaigns||[]).map(c=>({...c,level:+c.level||0,weeks:+c.weeks||0,ongoing:!!c.ongoing&&c.ongoing!=='0'&&c.ongoing!=='false'}));
  DB.ticks=Object.fromEntries((d.ticks||[]).map(t=>[t.key,t]));
  DB.stories=Object.fromEntries((d.stories||[]).map(t=>[t.key,t]));
  DB.sundays=Object.fromEntries((d.sundays||[]).map(t=>[t.date,t]));
  DB.owners=Object.fromEntries((d.owners||[]).map(t=>[t.channel,t.name]));
  DB.mcToken=d.mcToken||'';
  cache={};
}
function dump(){return {campaigns:DB.campaigns,ticks:Object.values(DB.ticks),stories:Object.values(DB.stories),sundays:Object.values(DB.sundays),owners:Object.entries(DB.owners).map(([channel,name])=>({channel,name})),mcToken:DB.mcToken}}
function store(){cache={};try{localStorage.setItem(DEV?'pp-demo':'pp-data',JSON.stringify(dump()))}catch(e){}}

const pending=[];let flushing=false;
async function post(action,body){
  store();
  if(DEV)return;
  pending.push({action,...body});
  if(flushing)return;
  flushing=true;
  while(pending.length){
    const job=pending[0];
    try{
      const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...job,key:job.key||code})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error);
      pending.shift();
    }catch(e){pending.length=0;toast("That didn't save. Check your connection and try again.");await refresh(true);break}
  }
  flushing=false;
}
async function fetchAll(c){
  const r=await fetch(CONFIG.apiUrl+'?key='+encodeURIComponent(c));
  return r.json();
}
let lastJson='';
async function refresh(force){
  if(DEV||!code)return;
  if(!force&&(pending.length||$('#dlg').open||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)))return;
  try{
    const j=await fetchAll(code);
    if(!j.ok){if(j.error==='code'){code='';try{localStorage.removeItem('pp-code')}catch(e){}render()}return}
    const s=JSON.stringify(j);
    if(s===lastJson&&!force)return;
    lastJson=s;ingest(j);store();render();
  }catch(e){}
}

// ---------- plan ----------
const lengthOf=c=>c.level==1?8:(WEEKMAP[c.weeks]?c.weeks:4);
const active=()=>DB.campaigns.filter(c=>c.status==='active');
const dated=()=>active().filter(c=>!c.ongoing&&c.date);
const ongoing=()=>active().filter(c=>c.ongoing).sort((a,b)=>a.name.localeCompare(b.name));
const rotation=()=>ongoing().filter(c=>c.level==2);

function weeksOf(c){
  const k='w'+c.id;if(cache[k])return cache[k];
  const last=sunOf(c.date),pb=PB[c.level]||PB[5];
  // A fundraiser or awareness campaign fills its whole run. If it's already under way, the plan starts from when it was added.
  if(c.start&&c.level!=1){
    const from=nextSun(c.created>c.start?c.created:c.start),n=Math.max(1,Math.round((D(last)-D(from))/6048e5)+1);
    return cache[k]=RUNMAP(n).map((tw,i)=>({i:i+1,n,tw,k:'r'+(i+1),sun:add(last,-(n-1-i)*7),...pb[tw],angle:RUNNAME[tw]||pb[tw].angle,bull:String(pb[tw].bull).replace('this weekend','last week')}));
  }
  const n=lengthOf(c),map=WEEKMAP[n];
  return cache[k]=map.map((tw,i)=>({i:i+1,n,tw,k:tw,sun:add(last,-(n-1-i)*7),...pb[tw]}));
}
const weekAt=(c,sun)=>weeksOf(c).find(w=>w.sun===sun);
const startOf=c=>weeksOf(c)[0].sun;
const sayKey=(c,w)=>`${c.id}~w${w.k}~say`;

// A campaign's own changes to its plan: tasks added, and plan tasks removed.
const editsOf=c=>{try{const e=JSON.parse(c.edits||'{}');return {add:e.add||[],del:e.del||[],ren:e.ren||{}}}catch(e){return {add:[],del:[],ren:{}}}};
const addedKey=(c,x)=>`${c.id}~x~${x.id}`;
function planTasks(c){
  const out=[];
  PREP(c.level).forEach((label,j)=>{if(label)out.push({key:`${c.id}~prep~${j}`,date:add(startOf(c),-3),ch:'prep',label,opt:false,c,w:'prep'})});
  weeksOf(c).forEach(w=>{
    if(w.say==='req'||w.say==='opt'){if(w.sun<=c.date)out.push({key:sayKey(c,w),date:w.sun,ch:'say',label:w.angle,opt:w.say==='opt',c,w:w.i,say:true})}
    w.tasks.forEach((t,j)=>{let date=add(w.sun,t[0]);if(date>c.date){if(!c.start||c.level==1)return;date=add(date,-7)}
      out.push({key:`${c.id}~w${w.k}~${t[1]}${j}`,date,ch:t[1],label:t[2],opt:!!t[3],c,w:w.i})});
  });
  AFTER(c.level).forEach((t,j)=>out.push({key:`${c.id}~after~${j}`,date:add(c.date,t[0]),ch:t[1],label:t[2],opt:false,c,w:'after'}));
  // The graphics this plan uses, each due the Thursday before its first use. Removing a task removes its graphic.
  const del=editsOf(c).del;
  ASSETLIST(weeksOf(c),out.filter(t=>!del.includes(t.key)),add).forEach(a=>out.push({key:`${c.id}~art~${a.slug}`,date:a.date,ch:'art',label:a.name,note:`${a.spec?a.spec+', ':''}for ${fmt(a.first)}`,opt:a.opt,c,w:'prep'}));
  return out;
}
// Each week one campaign leads on social and churchwide email and text, one rides along, and the rest wait.
function ranks(){
  if(cache.ranks)return cache.ranks;
  const ts=[],push=(t,c,fixed)=>ts.push({key:t.key,id:c.id,level:c.level,end:fixed?'9999-12-31':c.date,date:t.date,opt:!!t.opt,fixed:!!fixed,kind:t.ch==='social'?'social':'msg'});
  const ranked=(t,c)=>t.ch==='social'||(['email','text'].includes(t.ch)&&c.level<=2);
  dated().forEach(c=>rawTasks(c).forEach(t=>{if(!t.added&&t.date>=(c.created||'')&&ranked(t,c))push(t,c)}));
  for(let s=sunOf(TODAY),i=0;i<26;i++,s=add(s,7))highlightRaw(s).forEach(t=>{if(ranked(t,t.c))push(t,t.c,true)});
  const over={};Object.values(DB.stories).forEach(x=>{if(x.key.startsWith('rank~'))over[x.key.slice(5)]=x.story});
  return cache.ranks=RANKWEEKS(ts,over,add,sunOf);
}
const withRank=t=>{const r=ranks()[t.key];return r?{...t,date:r.date,rank:r.rank,kind:r.kind,lead:r.lead,hold:!!r.hold,moved:!!r.moved,from:r.from,opt:t.opt||!!r.hold}:t};
function tasksOf(c){
  const k='t'+c.id;if(cache[k])return cache[k];
  return cache[k]=rawTasks(c).map(withRank);
}
function rawTasks(c){
  const k='r'+c.id;if(cache[k])return cache[k];
  const e=editsOf(c),st=startOf(c);
  const added=e.add.map(x=>({key:addedKey(c,x),date:x.date,ch:x.say?'say':x.ch||'other',label:x.label,opt:false,c,w:x.date>c.date?'after':x.date<st?'early':weekAt(c,sunOf(x.date))?.i||'early',say:!!x.say,added:true}));
  return cache[k]=[...planTasks(c).filter(t=>!e.del.includes(t.key)).map(t=>e.ren[t.key]?{...t,label:e.ren[t.key]}:t),...added];
}
// The week as Sunday sees it: an added announcement switches it on, a removed one switches it off.
function sundayWeek(c,sun){
  const w=weekAt(c,sun),e=editsOf(c),x=e.add.find(a=>a.say&&a.date===sun);
  if(x)return {...(w||{i:0,n:0,sun,tasks:[]}),say:'req',angle:x.label,x:addedKey(c,x)};
  if(!w)return w;
  return e.del.includes(sayKey(c,w))?{...w,say:null}:e.ren[sayKey(c,w)]?{...w,angle:e.ren[sayKey(c,w)]}:w;
}
const isDone=k=>!!DB.ticks[k];
const openTasks=c=>tasksOf(c).filter(t=>!t.opt&&!isDone(t.key)&&!(t.date<(c.created||'')));

// Level 2 next steps with no end date take turns in a one-week highlight, every 4 to 6 weeks.
function highlightFor(sun){
  const list=rotation();if(!list.length)return null;
  const every=Math.max(4,Math.min(6,list.length));
  const idx=Math.round(D(sun)/6048e5)%every;
  const c=list[idx];
  return c?{c,hl:true,w:{angle:'Highlight week',i:0,n:0,sun,say:'req',tasks:HIGHLIGHT}}:null;
}
const itemSayKey=(it,sun)=>it.hl?`${it.c.id}~hl~${sun}`:it.w.x||sayKey(it.c,it.w);

function lineup(sun){
  const k='l'+sun;if(cache[k])return cache[k];
  const items=dated().filter(c=>c.date>=sun&&c.level).map(c=>({c,w:sundayWeek(c,sun)})).filter(x=>x.w);
  const byPri=(a,b)=>a.c.level-b.c.level||a.c.date.localeCompare(b.c.date);
  const req=items.filter(x=>x.w.say==='req').sort(byPri);
  const hl=highlightFor(sun);
  const optional=[...items.filter(x=>x.w.say==='opt').sort(byPri),...items.filter(x=>x.w.say==='smuggle').sort(byPri)];
  const all=[...req,...optional,...(hl?[hl]:[])];
  const find=id=>all.find(x=>x.c.id===id)||null;
  let stage,booth;
  const over=DB.sundays[sun];
  if(over){
    stage=over.stage?find(over.stage):null;
    booth=String(over.booth||'').split(',').filter(Boolean).map(find).filter(Boolean).slice(0,SLOTS.booth);
  }else{
    stage=req.find(x=>x.c.level<=2)||null;
    booth=req.filter(x=>x!==stage).slice(0,SLOTS.booth);
    // A highlight only fills a quiet Sunday. Otherwise it waits in the open slot's list.
    if(hl&&(stage?1:0)+booth.length<2){if(!stage)stage=hl;else booth.push(hl)}
  }
  const on=new Set([stage,...booth].filter(Boolean).map(x=>x.c.id));
  const bumped=req.filter(x=>!on.has(x.c.id));
  const spare=all.filter(x=>!on.has(x.c.id));
  const resting=items.filter(x=>!x.w.say&&x.c.level<=3).map(x=>x.c);
  const bulletin=items.filter(x=>x.c.level>=4&&x.w.phase).map(x=>x.c);
  return cache[k]={stage,booth,bumped,spare,resting,bulletin,count:on.size};
}

// Tasks that belong to the week, not to a campaign: one slide loop, one desk, one bulletin.
function sharedTasks(sun){
  const k='s'+sun;if(cache[k])return cache[k];
  const list=dated().filter(c=>c.level).map(c=>({c,w:weekAt(c,sun)})).filter(x=>x.w&&x.c.date>=sun);
  const names=f=>list.filter(x=>f(x.w)).sort((a,b)=>a.c.level-b.c.level).map(x=>x.c.name);
  const ns=rotation().length?['Next Steps']:[];
  const out=[];
  const slide=[...names(w=>w.slide),...ns],desk=[...names(w=>w.desk),...ns];
  const bull=[...list.filter(x=>x.w.bull).sort((a,b)=>(a.w.bull.startsWith('Featured')?0:1)-(b.w.bull.startsWith('Featured')?0:1)||a.c.level-b.c.level).map(x=>x.c.name),...ns];
  if(slide.length)out.push({key:'slide~'+sun,date:sun,ch:'slide',name:'Run the pre-service slides',list:slide});
  if(desk.length)out.push({key:'desk~'+sun,date:sun,ch:'desk',name:'Brief the Welcome Desk',list:desk});
  if(bull.length)out.push({key:'bulletin~'+sun,date:add(sun,4),ch:'bulletin',name:'Publish the Weekly Bulletin',list:bull});
  return cache[k]=out;
}

// Same weekday of the same week next month: the 1st Tuesday stays the 1st Tuesday.
function nextMonthSame(date){
  const d=D(date),n=Math.ceil(d.getDate()/7),x=new Date(d.getFullYear(),d.getMonth()+1,1);
  x.setDate(1+((d.getDay()-x.getDay()+7)%7)+(n-1)*7);
  return x.getMonth()===(d.getMonth()+1)%12?S(x):S(new Date(d.getFullYear(),d.getMonth()+1,d.getDate()));
}

// On a phone only the current week stays open. The rest fold to one line until tapped.
function rowShell(id,left,right,isNow,collapsed,sum){
  if(collapsed)return `<div class="pw-done" id="${id}">${I(ICON.check,16)}<span>${esc(collapsed)}</span></div>`;
  const fold=sum&&isPhone()&&!view.editTasks&&!isNow,on=view.pwOpen?.has(id);
  if(fold&&!on)return `<button class="pw-row" id="${id}" data-act="pwOpen" data-k="${id}" aria-expanded="false"><span class="chev">${I(ICON.right,14)}</span><span class="pw-row-d">${esc(sum.date)}</span><span class="pw-row-n">${esc(sum.name)}</span><span class="pw-row-m">${sum.meta||''}</span></button>`;
  return `<section class="pw${isNow?' now':''}" id="${id}"><div${fold?` data-act="pwOpen" data-k="${id}" role="button" tabindex="0" aria-expanded="true"`:''}>${left}</div><div class="pw-cols">${right}</div></section>`;
}
function weekRow(c,w,now){
  const ts=tasksOf(c).filter(t=>t.w===w.i);
  const shared=sharedTasks(w.sun).filter(t=>t.list.includes(c.name));
  const say=ts.find(t=>t.say);
  const dayTasks=d=>ts.filter(t=>!t.say&&D(t.date).getDay()===d);
  const isNow=now===w;
  const past=add(w.sun,6)<TODAY;
  const openCount=ts.filter(t=>!t.opt&&!isDone(t.key)&&t.date>=(c.created||'')).length;
  const editing=view.editTasks===c.id;
  const skipped=past&&!openCount&&!editing;
  if(skipped)return rowShell('pw-'+w.i,'','',false,`${fmt(w.sun)}: ${angleOf(w,c)}`);
  const l=lineup(w.sun),it=[l.stage,...l.booth].find(x=>x&&x.c.id===c.id);
  const where=it?(l.stage===it?'Stage':'Booth'):'';
  const storyKey=`${c.id}~${w.sun}`,story=DB.stories[storyKey]?.story;
  let sayHTML='';
  if(say){
    sayHTML=todo(say.key,`Announce: ${say.label}`,where||(say.opt?'':'Bumped to the bulletin'),say.opt);
    if(editing)sayHTML=`<div class="tw">${sayHTML}${removeBtn(say)}</div>`;
    if(w.sun<TODAY)sayHTML=`<div class="said-past">${sayHTML}</div>`;
    else if(it)sayHTML+=`<button class="storyline" data-act="story" data-id="${esc(c.id)}" data-sun="${w.sun}">${story?esc(story):'<u>Add the story</u>'}</button>`;
  }
  const also=[w.slide?'Pre-service slide':'',w.desk?'Welcome Desk':'',w.bull?'Weekly Bulletin':''].filter(Boolean).join(', ');
  const col=(h,inner)=>inner?`<div class="pw-col"><h4>${h}</h4>${inner}</div>`:'';
  const row=t=>taskLine(t,rankNote(t),true);
  const isNext=!isNow&&w.sun===nextSun(TODAY);
  const left=`${pwHead(fmt(w.sun),w.phase,`ph-${esc(w.phase)}`,isNow,isNext)}<div class="pw-angle">${esc(angleOf(w,c))}</div>${c.level<=3&&PLAYBOOK[angleOf(w,c)]?`<div class="pw-pb">Playbook: ${esc(PLAYBOOK[angleOf(w,c)])}</div>`:''}<div class="pw-why">${esc(WHYWEEK[c.level]?.[w.tw]||'')}</div>`;
  const sunHead=w.sun===TODAY?'Today':w.sun<TODAY&&isNow?'Last Sunday':'Sunday';
  const right=col(sunHead,sayHTML+dayTasks(0).map(row).join(''))+col('Tuesday',dayTasks(2).map(row).join(''))+col('Other days',ts.filter(t=>!t.say&&![0,2].includes(D(t.date).getDay())).map(t=>taskLine(t,shortDay(t.date),true)).join(''))+`<p class="pw-also">Also on: ${esc(also)}</p>`;
  return rowShell('pw-'+w.i,left,right,isNow,'',{date:fmt(w.sun),name:angleOf(w,c),meta:rowMeta(ts,isNext,c)});
}
function pageOngoing(c){
  const sundays=[];
  if(c.level==2)for(let s=nextSun(TODAY),i=0;i<26&&sundays.length<4;i++,s=add(s,7)){const h=highlightFor(s);if(h&&h.c.id===c.id)sundays.push(s)}
  const every=c.level==2?'Pre-service slide, Welcome Desk, Launcher action, web page, Featured Events, main calendar, Weekly Bulletin':LEVEL[c.level]?.web||'';
  return chrome('campaigns',`
  <section class="cz ph-prep"><div class="cz-top"><a class="back" href="#/campaigns" aria-label="Campaigns">${I(ICON.left)}</a><span class="spacer"></span><button class="btn" data-act="edit" data-id="${esc(c.id)}">Edit</button></div>
    <div><h1>${esc(c.name)}</h1><p class="cz-date">Always on, Level ${c.level}</p></div></section>
  <section class="pw" style="margin-top:20px"><div><div class="pw-angle">Every week</div></div><div><p style="font-size:18px">${esc(every)}</p></div></section>
  ${sundays.length?`<section class="pw"><div><div class="pw-angle">Highlight weeks</div></div><div class="rail">${sundays.map(s=>`<a href="#/sunday/${s}">${esc(fmt(s))}</a>`).join('')}</div></section>`:''}`);
}

// ---------- sunday ----------
function pageSunday(sun){
  const cur=nextSun(TODAY);
  sun=sun||cur;
  const l=lineup(sun);
  const when=sun===TODAY?'today':sun===cur?'this Sunday':'on '+long(sun);
  const n=l.count;
  const head=n===1?`Say <em>one thing</em> ${when}.`:n===0?`Say <em>nothing</em> ${when}.`:`Say <em>${word(n)} things</em> ${when}.`;
  const rail=[];const a0=add(sun<cur?sun:cur,-56),a1=add(sun>cur?sun:cur,182);for(let s=a0;s<=a1;s=add(s,7))rail.push(`<a href="#/sunday/${s}" aria-current="${s===sun}">${esc(fmt(s))}<small>${lineup(s).count} of 3</small></a>`);
  const q=[];
  if(l.bumped.length)q.push(['Bumped to the bulletin',l.bumped.map(x=>x.c)]);
  if(l.bulletin.length)q.push(['Bulletin only',l.bulletin]);
  if(l.resting.length)q.push(['Resting',l.resting]);
  return chrome('sunday',`
  <h1>${head}</h1>
  <div class="railbar"><a class="arrow" href="#/sunday/${add(sun,-7)}" aria-label="Previous Sunday">${I(ICON.left)}</a><div class="rail rail-scroll">${rail.join('')}</div><a class="arrow" href="#/sunday/${add(sun,7)}" aria-label="Next Sunday">${I(ICON.right)}</a>${sun===cur?'':`<a class="btn" href="#/sunday/${cur}">This Sunday</a>`}</div>
  <div class="slots">
    ${slot('stage','Stage',l.stage,sun,l)}
    ${slot('booth','Booth',l.booth[0],sun,l)}
    ${slot('booth','Booth',l.booth[1],sun,l)}
  </div>
  <div class="sun-tools"><a class="btn bare" href="#/mc" style="padding:0">MC view</a></div>
  ${q.length?`<dl class="quiet">${q.map(([t,cs])=>`<div><dt>${t}</dt><dd>${cs.map(c=>`<a href="#/c/${esc(c.id)}">${esc(c.name)}</a>`).join(', ')}</dd></div>`).join('')}</dl>`:''}`);
}
const mcUrl=()=>DB.mcToken?`${location.origin}${location.pathname}?mc=${DB.mcToken}`:'';
function lineupText(sun){
  const l=lineup(sun),line=(it,w)=>`${w}: ${it.c.name} (${it.w.angle})${DB.stories[`${it.c.id}~${sun}`]?`\n${DB.stories[`${it.c.id}~${sun}`].story}`:''}`;
  return [full(sun),...[[l.stage,'Stage'],...l.booth.map(x=>[x,'Booth'])].filter(x=>x[0]).map(([it,w])=>line(it,w)),`Next step: ${CONFIG.nextStep}`].join('\n\n');

function mcHTML(data){

    ${data.items.length?data.items.map(i=>`<section class="mc-item"><span class="tag">${esc(i.where)}</span><h2>${esc(i.name)}</h2><p class="mc-angle">${esc(i.angle)}</p><p class="mc-story">${i.story?esc(i.story):'No story yet.'}</p></section>`).join(''):'<p class="empty">Nothing to announce this Sunday.</p>'}

function localMc(){

async function bootMc(){

  try{const r=await fetch(CONFIG.apiUrl+'?mc='+encodeURIComponent(qs.get('mc')));const j=await r.json();if(!j.ok)throw 0;app.innerHTML=mcHTML(j)}

function slot(kind,label,it,sun,l){

function changeSheet(sun,kind,id){
  const l=lineup(sun),on=[l.stage,...l.booth].find(x=>x&&x.c.id===id);if(!on)return;

  const other=kind==='stage'?l.booth.map(x=>[x,'In the Booth']):l.stage?[[l.stage,'On stage']]:[];
  const rows=[...other,...l.spare.map(x=>[x,x.hl?'Highlight week':x.w.say==='smuggle'?'Under a Level 2 ask':x.w.angle])];

const rung=(sel,act)=>l=>`<button class="rung l${l}" data-act="${act}" data-l="${l}" aria-pressed="${l===sel}"><span>Level ${l}</span><small>${esc(LEVEL[l].name)}</small></button>`;
function replyFor(c,opts={}){
  const hi=c&&c.requester?`Hi ${c.requester.split(' ')[0]},`:'Hi,';
  const l=c?c.level:opts.level,L=LEVEL[l];
  const lines=[hi,''];
  if(c){
    lines.push(`Thanks for sending ${c.name}. It's a Level ${l} (${L.name.toLowerCase()}), so here's how we'll promote it:`,'');
    lines.push(`Website: ${L.web}`,`Email and text: ${L.msg}`,`Social: ${L.social}`,`Sunday: ${L.sun}`,`Length: ${L.len}`,'');
    if(c.date)lines.push(`Promo starts ${full(startOf(c))}.`,'');
    lines.push(`Every promo points to one place: the Next Steps button at oceansidechurch.ca.`,'',`Have a story from this ministry? Send it over. A story moves people more than details do, and it's the best thing you can give us.`);
  }else{
    const a=ASKS[opts.ask],[,headline,instead]=a.at(l);
    lines.push(`Thanks for caring about this. Here's how our communications policy handles it.`,'',`${headline} ${instead}`,'',`We use the same levels for every ministry, so nothing gets drowned out: ${a.rule.toLowerCase()}.`,'',`Have a story from this ministry? Send it over. A story moves people more than details do.`);
  }
  return lines.join('\n');
}

function fitWeeks(){

  const avail=wiz.date?Math.floor((D(sunOf(wiz.date))-D(sunOf(TODAY)))/6048e5)+1:4;
  return wiz.weeks&&WEEKMAP[wiz.weeks]?wiz.weeks:avail>=4?4:avail>=3?3:2;
}

const dateField=(label,name,val)=>`<div class="dp"><span class="lbl">${label}</span><input type="hidden" name="${name}" value="${esc(val||'')}"><button type="button" class="dp-btn${val?'':' empty'}" aria-expanded="false"><span>${val?esc(full(val)):'Choose a date'}</span>${I(ICON.cal)}</button><div class="dp-cal" hidden></div><p class="dp-err" hidden>Choose a date to continue.</p></div>`;
function bindDate(form){form.querySelectorAll('.dp').forEach(bindDateBox)}
function bindDateBox(box){
  const input=$('input',box),btn=$('.dp-btn',box),cal=$('.dp-cal',box);
  let month=(input.value||TODAY).slice(0,7);
  const shift=n=>{const x=D(month+'-01');x.setMonth(x.getMonth()+n);month=S(x).slice(0,7);draw()};
  function draw(){
    const first=month+'-01',start=sunOf(first),cells=[];
    for(let i=0,d=start;i<42;i++,d=add(d,1)){if(i%7===0&&i&&d.slice(0,7)!==month)break;
      cells.push(`<button type="button" data-d="${d}" class="${d.slice(0,7)!==month?'out ':''}${d===TODAY?'today ':''}${d===input.value?'sel':''}" aria-label="${esc(full(d))}">${D(d).getDate()}</button>`)}
    cal.innerHTML=`<div class="dp-head"><button type="button" class="arrow" data-m="-1" aria-label="Previous month">${I(ICON.left)}</button><b>${esc(fmt(first,{month:'long',year:'numeric'}))}</b><button type="button" class="arrow" data-m="1" aria-label="Next month">${I(ICON.right)}</button></div><div class="dp-grid">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}${cells.join('')}</div>`;
  }
  btn.onclick=()=>{cal.hidden=!cal.hidden;btn.setAttribute('aria-expanded',!cal.hidden);if(cal.hidden)return;draw();
    box.parentElement.querySelectorAll('.dp').forEach(o=>{if(o!==box){$('.dp-cal',o).hidden=true;$('.dp-btn',o).setAttribute('aria-expanded','false')}})};
  cal.onclick=e=>{const m=e.target.closest('[data-m]');if(m)return shift(+m.dataset.m);const c=e.target.closest('[data-d]');if(!c)return;
    input.value=c.dataset.d;month=input.value.slice(0,7);$('span',btn).textContent=full(input.value);btn.classList.remove('empty');cal.hidden=true;btn.setAttribute('aria-expanded','false');$('.dp-err',box).hidden=true};
}
function dateMissing(form){
  const show=(box,msg)=>{const err=$('.dp-err',box);err.textContent=msg;err.hidden=false;const cal=$('.dp-cal',box);if(cal.hidden)$('.dp-btn',box).click();return true};
  const boxes=[...form.querySelectorAll('.dp')],empty=boxes.find(b=>!$('input',b).value);
  if(empty)return show(empty,'Choose a date to continue.');
  if(form.start&&form.date&&form.date.value<form.start.value)return show(boxes[1],'Choose a date after it starts.');
  return false;
}
const ministryField=(val,showLevel)=>`<label class="f combo" data-levels="${showLevel?1:''}">Which ministry?<input name="ministry" maxlength="120" value="${esc(val||'')}" autocomplete="off"><div class="combo-list" hidden></div></label>`;
function bindMinistry(form,onPick){
  const box=$('.combo',form);if(!box)return;
  const input=$('input',box),list=$('.combo-list',box),show=box.dataset.levels;
  const known=[...new Set([...Object.keys(MINISTRY),...DB.campaigns.map(c=>c.ministry).filter(Boolean)])].sort();
  const draw=()=>{const q=input.value.trim().toLowerCase();const m=known.filter(x=>x.toLowerCase().includes(q)&&x.toLowerCase()!==q).slice(0,6);
    list.hidden=!m.length;list.innerHTML=m.map(x=>`<button type="button" data-v="${esc(x)}">${esc(x)}${show&&MINISTRY[x]?`<span>Level ${MINISTRY[x]}</span>`:''}</button>`).join('')};
  input.onfocus=draw;input.oninput=draw;
  input.onblur=()=>setTimeout(()=>{list.hidden=true},150);
  list.onmousedown=e=>e.preventDefault();
  list.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;e.preventDefault();input.value=b.dataset.v;list.hidden=true;onPick&&onPick(input.value)};
}

    <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>`:`<label class="f">Who should we talk to?<input name="contact" maxlength="160" value="${esc(Q.contact)}" autocomplete="off"></label>`}

  qLevel:b=>{Q.level=+b.dataset.l;Q.weeks=0;drawQuiz()},
  runAgain:b=>runAgainSheet(DB.campaigns.find(c=>c.id===b.dataset.id)),
  debrief:b=>debriefSheet(DB.campaigns.find(c=>c.id===b.dataset.id)),
  linkEdit:b=>linkSheet(b.dataset.k),
  linkClear:()=>withName(()=>{saveStory('link~'+view.linkKey,'');closeDlg();render()}),
  copyMc:()=>copy(mcUrl(),'MC link copied'),
  copyLineup:b=>copy(lineupText(b.dataset.sun),'Lineup copied'),
  sendReply:b=>withName(()=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);post('replyEmail',{to:c.contact,subject:c.name,body:$('#replyText').value,by:me});closeDlg();toast(DEV?'Test copy: no email sent':`Emailed ${c.contact}`)}),
  qSave:()=>{const c=quizRecord('active');saveCampaign(c);closeDlg();go('c/'+c.id)},
  qSend:()=>quizSend(),
    wkToggle:b=>{const o=view.wkOpen,k=b.dataset.s;o.has(k)?o.delete(k):o.add(k);render()},
  taskMode:b=>{view.editTasks=view.editTasks===b.dataset.id?'':b.dataset.id;closeDlg();render()},
  taskAdd:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);taskAddSheet(c,'task','',TODAY,'')},
  taskKind:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id),f=$('#taskForm');taskAddSheet(c,b.dataset.kind,f.label.value,f.date?.value||TODAY,f.sun?.value||'',f.ch?.value||'other')},
  taskEdit:b=>taskEditSheet(DB.campaigns.find(x=>x.id===b.dataset.id),b.dataset.k),
  rankChange:b=>rankSheet(b.dataset.kind,b.dataset.sun),
  taskDel:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id),e=editsOf(c),k=b.dataset.k,x=e.add.find(a=>addedKey(c,a)===k);
    if(x)e.add=e.add.filter(a=>a!==x);else e.del.push(k);saveEdits(c,e);render()},
  taskBack:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id),e=editsOf(c);e.del=e.del.filter(k=>k!==b.dataset.k);saveEdits(c,e);render()},
  tlOpen:b=>{const o=view.tlOpen=view.tlOpen||new Set(),{id,k}=b.dataset;if(o.has(id))o.delete(id);else if(k)o.has(k)?o.delete(k):o.add(k);else o.add(id);render()},
  tlGo:b=>tlGoTo(b.dataset.s,true),
  tlStep:b=>{const w=[...document.querySelectorAll('.twk-page')].map(x=>x.dataset.s),i=w.indexOf(view.tlWeek)+ +b.dataset.d;if(w[i])tlGoTo(w[i],true)},
  pwOpen:b=>{const o=view.pwOpen=view.pwOpen||new Set(),k=b.dataset.k;o.has(k)?o.delete(k):o.add(k);render()},
  campMore:b=>campMoreSheet(DB.campaigns.find(x=>x.id===b.dataset.id)),
  ruleLevel:b=>{view.ruleLevel=+b.dataset.l;render()},
  tlAll:()=>{const o=view.tlOpen=view.tlOpen||new Set();if(o.size)o.clear();else dated().forEach(c=>o.add(c.id));render()},

  schedMore:()=>{view.schedWeeks=(view.schedWeeks||6)+6;render()},
  edit:b=>openWizard(DB.campaigns.find(c=>c.id===b.dataset.id)),
  triage:b=>openWizard(DB.campaigns.find(c=>c.id===b.dataset.id),true),
  reply:b=>replySheet(DB.campaigns.find(c=>c.id===b.dataset.id)),
  rename:()=>{openDlg(`<form class="sheet" id="nameForm"><div class="sheet-head"><h2>Your name</h2>${closeBtn()}</div><label class="f">Name<input name="me" required value="${esc(me)}"></label><div class="sheet-foot"><button class="btn solid">Save</button></div></form>`);
    $('#nameForm').onsubmit=e=>{e.preventDefault();me=e.target.me.value.trim();try{localStorage.setItem('pp-me',me)}catch(x){}closeDlg();render()}},
  closeDlg:()=>closeDlg(),
  wizLevel:b=>{wiz.level=+b.dataset.l;drawWizard()},
  wizNext:()=>{if(!wiz.level)return;if(wiz.ongoing){finishWizard();return}wiz.step=3;drawWizard()},
  wizRun:()=>{const f=$('#wiz1');wiz.name=f.name.value;wiz.notes=f.notes.value;wiz.ministry=f.ministry.value;wiz.date=f.date?f.date.value:'';wiz.start=f.start?f.start.value:wiz.start;wiz.run=!wiz.run;drawWizard()},
  wizBack:()=>{wiz.step=wiz.step===3?2:1;drawWizard()},
  wizWeeks:b=>{wiz.weeks=+b.dataset.n;drawWizard()},
  wizSave:()=>finishWizard(),
  delAsk:b=>{if(b.dataset.sure){removeCampaign(b.dataset.id);closeDlg();go('campaigns');toast('Deleted')}else{b.dataset.sure='1';b.textContent='Delete for good?'}},
  story:b=>storySheet(b.dataset.id,b.dataset.sun),
  fill:b=>fillSheet(b.dataset.sun,b.dataset.kind),
  fillPick:b=>{const{sun,kind,id,replace}=b.dataset,l=lineup(sun);let st=l.stage?.c.id,bo=l.booth.map(x=>x.c.id);
    if(replace){const swap=x=>x===replace?id:x===id?replace:x;st=swap(st);bo=bo.map(swap)}
    else if(kind==='stage')st=id;else bo=[...bo,id].slice(0,SLOTS.booth);
    setLineup(sun,st,bo);closeDlg();render()},
  change:b=>changeSheet(b.dataset.sun,b.dataset.kind,b.dataset.id),
  takeOff:b=>{const{sun,id}=b.dataset,l=lineup(sun);setLineup(sun,l.stage?.c.id===id?'':l.stage?.c.id,l.booth.map(x=>x.c.id).filter(x=>x!==id));closeDlg();render()},
    close:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);saveCampaign({...c,status:'done'});burst(innerWidth/2,innerHeight/3,26);toast('That\'s a wrap. Nice work.');go('campaigns')},
  reopen:b=>{const c=DB.campaigns.find(x=>x.id===b.dataset.id);saveCampaign({...c,status:'active'});render()},
  rulesTab:b=>{view.rulesTab=b.dataset.k;render()},
  askLevel:b=>{view.askLevel=+b.dataset.l;render()},
  askWhat:b=>{view.ask=b.dataset.k;render()},
    copyVerdict:()=>copy(replyFor(null,{level:view.askLevel||4,ask:view.ask||'stage'}),'Reply copied'),
  copyReply:()=>copy($('#replyText').value,'Reply copied'),
  copyAsk:()=>copy(location.origin+location.pathname+'?ask','Request link copied'),
  lateToggle:()=>{view.lateOpen=!view.lateOpen},
  skipLate:()=>{overdue().forEach(t=>{DB.ticks[t.key]={key:t.key,by:'Cleared',at:TODAY};post('tick',{key_:t.key,on:true,by:'Cleared'})});render()},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tick]');
  if(t){e.preventDefault();const k=t.dataset.tick,was=isDone(k),box=$('.box',t)?.getBoundingClientRect();
    withName(()=>{view.popped=was?'':k;tick(k);
      if(!was){if(box)burst(box.left+box.width/2,box.top+box.height/2);
        const pr=weekProgress();
        if(pr.total&&pr.done===pr.total){burst(innerWidth/2,innerHeight/3,26);toast('That\'s the whole week. Go get a coffee.')}else toast(NICE[Math.floor(Math.random()*NICE.length)])}});return}
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();const id=j.dataset.jump;
    if(document.getElementById(id)?.matches('.pw-row')){(view.pwOpen=view.pwOpen||new Set()).add(id);render()}
    document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  const l=e.target.closest('a[href^="#/"]');
  if(l){e.preventDefault();closeDlg();setRoute(l.getAttribute('href'));return}
  const b=e.target.closest('[data-act]');
  if(b&&ACT[b.dataset.act]){if(WRITES.has(b.dataset.act))withName(()=>ACT[b.dataset.act](b));else ACT[b.dataset.act](b)}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-story]');
  if(s){saveStory(s.dataset.story,s.value);toast('Story saved')}
});

// ---------- routes ----------
let route=location.hash||'#/todo';
function setRoute(h){
  if(h!==route){view.week=null;view.pwOpen=null}
  route=h;
  try{history.pushState(null,'',h)}catch(e){}
  render();
}
function go(p){setRoute('#/'+p)}
function render(){
  const app=$('#app');
  if(route==='#/mc'&&(DEV||(!qs.has('mc')&&code))){const sun=nextSun(TODAY);$('#app').innerHTML=`<div class="mc-tools"><a class="btn" href="#/sunday">Back to Sunday</a><span style="flex:1"></span>${mcUrl()?'<button class="btn" data-act="copyMc">Copy link for the MC</button>':''}<button class="btn" data-act="copyLineup" data-sun="${sun}">Copy text</button></div>`+mcHTML(localMc());return}
  if(qs.has('ask')||route==='#/ask'){
    if(app.dataset.ask)return;
    app.dataset.ask='1';startQuiz('ask');return;
  }
  delete app.dataset.ask;
  if(!DEV&&!code){app.innerHTML=pageGate();bindGate();return}
  const y=scrollY;
  const[,name='todo',arg]=route.split('/');
  const html=name==='campaigns'?pageCampaigns():name==='timeline'?pageTimeline():name==='c'?pageCampaign(decodeURIComponent(arg||'')):name==='sunday'?pageSunday(arg):name==='rules'?pageRules():pageTodo();
  const ss=$('.tl')?.scrollLeft,side=['.strip','.cgrid'].map(q=>[q,$(q)?.scrollLeft]);
  app.innerHTML=html;
  render.phone=isPhone();
  if($('.tl')){const t=$('.tl');t.scrollLeft=render.at===route&&ss!=null?ss:Math.max(0,$('.tl-now',t).offsetLeft-$('.tl-name',t).offsetWidth-TL_COL())}
  if(render.at===route)side.forEach(([q,v])=>{if(v!=null&&$(q))$(q).scrollLeft=v});
  else{const n=$('.strip a.now');if(n)$('.strip').scrollLeft=n.offsetLeft-12}
  tlPager();
  if(render.at===route)scrollTo(0,y);else scrollTo(0,0);
  const rs=$('.rail-scroll');if(rs){const a=$('[aria-current=true]',rs);rs.scrollLeft=a.offsetLeft-rs.clientWidth/2+a.offsetWidth/2}
  render.at=route;
}
const syncRoute=()=>{const h=location.hash||'#/todo';if(h!==route){view.week=null;view.pwOpen=null;route=h;render()}};
// The phone and desktop layouts are drawn differently, so crossing the line redraws.
addEventListener('resize',()=>{const p=isPhone();if(p!==render.phone)render()});
addEventListener('hashchange',syncRoute);
addEventListener('popstate',syncRoute);

// ---------- gate ----------
function pageGate(){
  return `<div class="solo"><div class="logo">Promo</div><h1><em>Promo</em> Planner.</h1>
  <form id="gate"><label class="f">Office code<input name="code" type="password" required autocomplete="off"></label>
  <p class="err" id="gerr" hidden></p><div><button class="btn solid">Open</button></div></form></div>`;
}
function bindGate(){
  $('#gate').onsubmit=async e=>{e.preventDefault();const c=e.target.code.value.trim(),btn=$('#gate button');btn.disabled=true;btn.textContent='Opening';const reset=()=>{btn.disabled=false;btn.textContent='Open'};
    try{const j=await fetchAll(c);if(!j.ok){const x=$('#gerr');x.hidden=false;x.textContent="That code didn't work.";reset();return}
      ingest(j);code=c;try{localStorage.setItem('pp-code',c)}catch(x){}}
    catch(x){const y=$('#gerr');y.hidden=false;y.textContent="Couldn't reach the planner. Check your connection.";reset();return}
    render()};
}

// ---------- boot ----------
(async function boot(){
  if(qs.has('ask')){render();return}
  if(qs.has('mc')&&!DEV){bootMc();return}
  if(DEV){
    let saved=null;try{saved=JSON.parse(localStorage.getItem('pp-demo'))}catch(e){}
    if(!saved||qs.has('reset')){if(!window.DEMO)await new Promise(r=>{const s=document.createElement('script');s.src='_local/demo.js';s.onload=r;s.onerror=r;document.head.append(s)});saved=window.DEMO||{}}
    ingest(saved);if(!me&&qs.has('me')){me=qs.get('me')}
    render();return;
  }
  try{const c=JSON.parse(localStorage.getItem('pp-data'));if(c)ingest(c)}catch(e){}
  render();
  await refresh(true);
  setInterval(()=>{if(!document.hidden)refresh()},45000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
